<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Settliv — Expense Sharing & Group Ledger</title>
  <meta name="description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">
  <meta name="theme-color" content="#0A0C1C">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Settliv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>

  <script>
    (function () {
      var mode = null;
      try {
        mode = localStorage.getItem('flutter.settliv_theme_mode') || localStorage.getItem('settliv_theme_mode');
        if (mode && mode.charAt(0) === '"') mode = JSON.parse(mode);
      } catch (_) {}
      var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var root = document.documentElement;
      root.dataset.theme = dark ? 'dark' : 'light';
      root.style.backgroundColor = dark ? '#0A0C1C' : '#F6F7FC';
      var mc = document.querySelector('meta[name="theme-color"]');
      if (mc) mc.content = dark ? '#0A0C1C' : '#F6F7FC';
    })();
  </script>

  <style>
    @font-face {
      font-family: 'BricolageGrotesque';
      src: url('assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }
    :root {
      --bg: #F6F7FC;
      --glow-a: #E9E5FF;
      --glow-b: #F6F7FC;
      --ink: #12132B;
      --emerald: #0FA37F;
      --coral: #EF5B48;
      --orbit: rgba(18, 19, 43, 0.05);
      --sheen: rgba(255, 255, 255, 0.55);
      --wm-w: clamp(220px, 34vw, 520px);
    }
    :root[data-theme="dark"] {
      --bg: #0A0C1C;
      --glow-a: #2A1B6B;
      --glow-b: #1A1640;
      --ink: #ECEBF5;
      --emerald: #4FE3B8;
      --coral: #FF8D7C;
      --orbit: rgba(236, 235, 245, 0.05);
      --sheen: rgba(255, 255, 255, 0.28);
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
    }
    body.intro-lock { overflow: hidden; }

    #loading-screen {
      position: fixed;
      inset: 0;
      height: 100dvh;
      z-index: 99999;
      overflow: hidden;
      pointer-events: auto;
    }
    #loading-screen.exiting { pointer-events: none; }

    .split-half {
      position: absolute;
      left: 0;
      right: 0;
      height: 50%;
      overflow: hidden;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 50%, var(--glow-a) 0%, var(--glow-b) 36%, transparent 72%);
      background-size: 100% 200%;
      background-repeat: no-repeat;
    }
    .split-half.top { top: 0; background-position: 0 0; }
    .split-half.bottom { bottom: 0; background-position: 0 100%; }

    .animating .split-half { will-change: transform, opacity; }
    #loading-screen.exiting .split-half.top {
      animation: splitUp 520ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }
    #loading-screen.exiting .split-half.bottom {
      animation: splitDown 520ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }
    @keyframes splitUp { to { transform: translateY(-100%); } }
    @keyframes splitDown { to { transform: translateY(100%); } }

    .slow-breathe .split-half {
      animation: bgBreathe 4s ease-in-out infinite alternate;
    }
    @keyframes bgBreathe {
      from { transform: scale(1); }
      to   { transform: scale(1.05); }
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.035;
      pointer-events: none;
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAH0lEQVQYV2NkYGD4z8DAwMgABXAGNgGwSgwVAFbmAgAw1wYFBcX5AAAAAElFTkSuQmCC");
    }

    .orbit-svg {
      position: absolute;
      left: 50%;
      width: min(94vmin, 820px);
      height: min(94vmin, 820px);
      transform: translateX(-50%);
      pointer-events: none;
    }
    .split-half.top .orbit-svg { bottom: calc(-0.5 * min(94vmin, 820px)); }
    .split-half.bottom .orbit-svg { top: calc(-0.5 * min(94vmin, 820px)); }

    .wm-anchor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px) * 0);
      display: flex;
      justify-content: center;
    }
    .wm-band {
      position: relative;
      width: var(--wm-w);
      overflow: hidden;
      display: flex;
      justify-content: center;
      padding: 6px 0 4px;
    }
    .wm-word {
      display: inline-flex;
      font-family: 'BricolageGrotesque', 'Sora', 'PlusJakartaSans', sans-serif;
      font-size: calc(var(--wm-w) / 5.45);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.18em;
      padding-left: 0.18em;
      color: var(--ink);
      opacity: 0;
      white-space: nowrap;
    }
    .ready .wm-word { opacity: 1; }
    #loading-screen.exiting .wm-word {
      animation: wmExit 520ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }
    @keyframes wmExit {
      to { opacity: 0; transform: scale(1.04); }
    }

    .g-pos { display: inline-block; }
    .g-rise { display: inline-block; }
    .play .g-rise {
      animation: riseOut 520ms cubic-bezier(0.16, 1, 0.3, 1) both;
      will-change: transform, opacity;
    }
    .play .g-pos {
      animation: trackIn 550ms cubic-bezier(0.65, 0, 0.35, 1) 300ms both;
      will-change: transform;
    }
    /* Centre-outward stagger: T(3)=60, T(2)&L(4)=105, E(1)&I(5)=150, S(0)&V(6)=195 */
    .play .g-pos:nth-child(4) .g-rise { animation-delay: 60ms; }
    .play .g-pos:nth-child(3) .g-rise,
    .play .g-pos:nth-child(5) .g-rise { animation-delay: 105ms; }
    .play .g-pos:nth-child(2) .g-rise,
    .play .g-pos:nth-child(6) .g-rise { animation-delay: 150ms; }
    .play .g-pos:nth-child(1) .g-rise,
    .play .g-pos:nth-child(7) .g-rise { animation-delay: 195ms; }

    .g-pos:nth-child(1) { --tx: -0.48em; }
    .g-pos:nth-child(2) { --tx: -0.32em; }
    .g-pos:nth-child(3) { --tx: -0.16em; }
    .g-pos:nth-child(4) { --tx: 0em; }
    .g-pos:nth-child(5) { --tx: 0.16em; }
    .g-pos:nth-child(6) { --tx: 0.32em; }
    .g-pos:nth-child(7) { --tx: 0.48em; }

    @keyframes riseOut {
      from { opacity: 0; transform: translateY(105%); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes trackIn {
      from { transform: translateX(var(--tx)); }
      to   { transform: translateX(0); }
    }

    .sheen {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 32%, var(--sheen) 50%, transparent 68%);
      transform: translateX(-115%);
      pointer-events: none;
      opacity: 0;
    }
    .play .sheen {
      animation: sheenPass 300ms ease-out 1000ms both;
      will-change: transform, opacity;
    }
    @keyframes sheenPass {
      0%   { opacity: 1; transform: translateX(-115%); }
      100% { opacity: 0; transform: translateX(115%); }
    }

    /* Balance line at exact 50% vertical centre */
    .seam {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--wm-w);
      height: 2px;
      margin-top: -1px;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .seg {
      position: absolute;
      top: 0;
      width: 50%;
      height: 2px;
      transform: scaleX(0);
    }
    .seg.em { left: 0; background: var(--emerald); transform-origin: left center; }
    .seg.co { right: 0; background: var(--coral); transform-origin: right center; }
    .play .seg.em,
    .play .seg.co {
      animation: segGrow 440ms ease-out 520ms both, segFade 140ms ease-out 960ms forwards;
      will-change: transform, opacity;
    }
    @keyframes segGrow { to { transform: scaleX(1); } }
    @keyframes segFade { to { opacity: 0; } }

    .seam-ink {
      position: absolute;
      inset: 0;
      background: var(--ink);
      opacity: 0;
      transform-origin: center;
    }
    .play .seam-ink {
      animation: inkLock 140ms ease-out 960ms both;
      will-change: transform, opacity;
    }
    @keyframes inkLock { to { opacity: 1; } }

    .seam-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: var(--ink);
      opacity: 0;
    }
    .play .seam-dot {
      animation: dotPulse 160ms ease-out 960ms both;
      will-change: transform, opacity;
    }
    @keyframes dotPulse {
      0%   { opacity: 0; transform: scale(0.6); }
      50%  { opacity: 1; transform: scale(1.35); }
      100% { opacity: 0; transform: scale(1); }
    }

    #loading-screen.exiting .seam-ink {
      animation: seamWiden 520ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }
    @keyframes seamWiden {
      0%   { opacity: 1; transform: scaleX(1); }
      100% { opacity: 0; transform: scaleX(4.6); }
    }

    /* Repeat / Reduced / Low-end static settled state + plain fade */
    .settled .wm-word { opacity: 1; }
    .settled .g-pos, .settled .g-rise { animation: none !important; transform: none !important; opacity: 1 !important; }
    .settled .seg, .settled .seam-dot, .settled .sheen { display: none; }
    .settled .seam-ink { opacity: 1; }
    .lite-fade.exiting {
      animation: plainFade 200ms ease-out forwards;
    }
    .repeat-fade.exiting {
      animation: plainFade 320ms ease-out forwards;
    }
    .lite-fade.exiting .split-half,
    .lite-fade.exiting .wm-word,
    .lite-fade.exiting .seam-ink,
    .repeat-fade.exiting .split-half,
    .repeat-fade.exiting .wm-word,
    .repeat-fade.exiting .seam-ink { animation: none !important; }
    @keyframes plainFade { to { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .g-pos, .g-rise, .seg, .seam-dot, .sheen { animation: none !important; }
      .wm-word { opacity: 1; }
      .seam-ink { opacity: 1; }
      .seg, .seam-dot, .sheen { display: none; }
    }
  </style>

  <script>
    (function () {
      if (window.__settlivIntroInit) return;
      window.__settlivIntroInit = true;

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
        });
      }

      var t0 = performance.now();
      var firstFrame = false;
      var done = false;
      var seen = false;
      try { seen = sessionStorage.getItem('settliv_intro_seen') === '1'; } catch (_) {}

      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var lowEnd = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ||
                   (navigator.deviceMemory && navigator.deviceMemory <= 4);
      var lite = reduced || lowEnd;

      function finishImmediate() {
        if (done) return;
        done = true;
        var el = document.getElementById('loading-screen');
        if (el && el.parentNode) el.parentNode.removeChild(el);
        if (document.body) document.body.classList.remove('intro-lock');
        try { sessionStorage.setItem('settliv_intro_seen', '1'); } catch (_) {}
        window.dispatchEvent(new CustomEvent('settliv-intro-reveal'));
        window.dispatchEvent(new CustomEvent('settliv-intro-done'));
      }

      function runExit(exitMs) {
        if (done) return;
        done = true;
        var el = document.getElementById('loading-screen');
        if (!el) { finishImmediate(); return; }
        window.dispatchEvent(new CustomEvent('settliv-intro-reveal'));
        el.classList.add('exiting');
        try { sessionStorage.setItem('settliv_intro_seen', '1'); } catch (_) {}
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
          if (document.body) document.body.classList.remove('intro-lock');
          window.dispatchEvent(new CustomEvent('settliv-intro-done'));
        }, exitMs);
      }

      function tryExit() {
        if (!firstFrame || done) return;
        var elapsed = performance.now() - t0;
        if (seen) {
          if (elapsed <= 250) { finishImmediate(); return; }
          var el = document.getElementById('loading-screen');
          if (el) el.classList.add('repeat-fade');
          setTimeout(function () { runExit(320); }, Math.max(0, 200 - elapsed));
          return;
        }
        if (lite) {
          var el2 = document.getElementById('loading-screen');
          if (el2) el2.classList.add('lite-fade');
          setTimeout(function () { runExit(200); }, Math.max(0, 250 - elapsed));
          return;
        }
        var wait = Math.max(0, 1250 - elapsed);
        setTimeout(function () { runExit(520); }, wait);
      }

      window.addEventListener('pageshow', function (e) {
        if (e.persisted) finishImmediate();
      });

      window.addEventListener('DOMContentLoaded', function () {
        if (document.hidden) { finishImmediate(); return; }
        var el = document.getElementById('loading-screen');
        if (!el) return;
        document.body.classList.add('intro-lock');

        if (seen || lite) {
          el.classList.add('settled', 'ready');
          tryExit();
          return;
        }

        var fontGate = (document.fonts && document.fonts.load)
          ? Promise.race([
              document.fonts.load('800 1em "BricolageGrotesque"'),
              new Promise(function (r) { setTimeout(r, 500); })
            ])
          : Promise.resolve();

        fontGate.then(function () {
          el.classList.add('ready', 'animating', 'play');
          setTimeout(function () {
            if (!firstFrame && !done) el.classList.add('slow-breathe');
          }, 1250);
          setTimeout(function () {
            el.classList.remove('animating');
          }, 1350);
          tryExit();
        });
      });

      window.addEventListener('flutter-first-frame', function () {
        firstFrame = true;
        tryExit();
      });

      setTimeout(finishImmediate, 8000);
    })();
  </script>
</head>
<body>
  <div id="loading-screen">
    <div class="split-half top" aria-hidden="true">
      <div class="grain"></div>
      <svg class="orbit-svg" viewBox="0 0 400 400" fill="none">
        <circle cx="200" cy="200" r="72" stroke="var(--orbit)" stroke-width="1"/>
        <circle cx="200" cy="200" r="104" stroke="var(--orbit)" stroke-width="1"/>
        <circle cx="200" cy="200" r="136" stroke="var(--orbit)" stroke-width="1"/>
        <circle cx="200" cy="200" r="168" stroke="var(--orbit)" stroke-width="1"/>
        <circle cx="200" cy="200" r="196" stroke="var(--orbit)" stroke-width="1"/>
      </svg>
      <div class="wm-anchor">
        <div class="wm-band">
          <div class="wm-word" role="img" aria-label="SETTLIV">
            <span class="g-pos"><span class="g-rise">S</span></span><span class="g-pos"><span class="g-rise">E</span></span><span class="g-pos"><span class="g-rise">T</span></span><span class="g-pos"><span class="g-rise">T</span></span><span class="g-pos"><span class="g-rise">L</span></span><span class="g-pos"><span class="g-rise">I</span></span><span class="g-pos"><span class="g-rise">V</span></span>
          </div>
          <div class="sheen" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <div class="split-half bottom" aria-hidden="true">
      <div class="grain"></div>
      <svg class="orbit-svg" viewBox="0 0 400 400" fill="none">
        <circle cx="200" cy="200" r="72" stroke="var(--orbit)" stroke-width="1"/>
        <circle cx="200" cy="200" r="104" stroke="var(--orbit)" stroke-width="1"/>
        <circle cx="200" cy="200" r="136" stroke="var(--orbit)" stroke-width="1"/>
        <circle cx="200" cy="200" r="168" stroke="var(--orbit)" stroke-width="1"/>
        <circle cx="200" cy="200" r="196" stroke="var(--orbit)" stroke-width="1"/>
      </svg>
    </div>
    <div class="seam" aria-hidden="true">
      <div class="seg em"></div>
      <div class="seg co"></div>
      <div class="seam-ink"></div>
      <div class="seam-dot"></div>
    </div>
  </div>
  <noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0A0C1C;color:#ECEBF5;font:800 32px sans-serif;letter-spacing:.18em">SETTLIV</div></noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
