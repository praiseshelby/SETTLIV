<!DOCTYPE html>
<html style="background:#070914">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Settliv — Expense Sharing & Group Ledger</title>
  <meta name="description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">
  <meta name="theme-color" content="#070914">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Settliv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    @font-face {
      font-family: 'BricolageGrotesque';
      src: url('assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }
    :root {
      --bg: #070914;
      --ink: #F2F0FA;
      --emerald: #4FE3B8;
      --coral: #FF8D7C;
      --ripple: rgba(201, 194, 255, 0.5);
      --wm-w: min(86vw, clamp(280px, 52vw, 720px));
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #070914;
    }
    body.intro-lock { overflow: hidden; }

    #intro {
      position: fixed;
      inset: 0;
      height: 100dvh;
      z-index: 99999;
      contain: strict;
      overflow: hidden;
    }
    #intro.exiting { pointer-events: none; }

    .half {
      position: absolute;
      left: 0;
      right: 0;
      overflow: hidden;
      will-change: transform;
    }
    .half.top { top: 0; height: calc(50% + 1px); }
    .half.bottom { top: 50%; height: 50%; }

    .scene {
      position: absolute;
      left: 0;
      right: 0;
      height: 100dvh;
    }
    .half.top .scene { top: 0; }
    .half.bottom .scene { top: -100%; }

    .cut-edge {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      opacity: 0;
      pointer-events: none;
    }
    .half.top .cut-edge { bottom: 0; }
    .half.bottom .cut-edge { top: 0; }

    #intro.exiting .cut-edge { opacity: 1; transition: opacity 140ms ease-out; }
    #intro.exiting .half.top { animation: splitUp 520ms cubic-bezier(0.65, 0, 0.35, 1) forwards; }
    #intro.exiting .half.bottom { animation: splitDown 520ms cubic-bezier(0.65, 0, 0.35, 1) forwards; }
    @keyframes splitUp { to { transform: translateY(-100%); } }
    @keyframes splitDown { to { transform: translateY(100%); } }

    /* Backdrop: fields + vignette + ledger rules + grain */
    .backdrop {
      position: absolute;
      inset: 0;
      background-color: #070914;
      background-image:
        radial-gradient(60vmax 60vmax at 15% 20%, rgba(106, 76, 255, 0.40) 0%, transparent 60%),
        radial-gradient(55vmax 55vmax at 85% 80%, rgba(40, 90, 255, 0.28) 0%, transparent 60%),
        radial-gradient(40vmax 40vmax at 70% 15%, rgba(12, 120, 140, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.45) 100%);
    }
    .rules {
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.08) 0 1px, transparent 1px 128px),
        repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.045) 0 1px, transparent 1px 32px);
      -webkit-mask-image: radial-gradient(ellipse 74% 66% at 50% 50%, #000 18%, transparent 88%);
      mask-image: radial-gradient(ellipse 74% 66% at 50% 50%, #000 18%, transparent 88%);
    }
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.035;
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAH0lEQVQYV2NkYGD4z8DAwMgABXAGNgGwSgwVAFbmAgAw1wYFBcX5AAAAAElFTkSuQmCC");
    }

    /* Centre-line currents racing from opposite edges */
    .line-group {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      margin-top: -1px;
    }
    .curr {
      position: absolute;
      top: 0;
      width: 50%;
      height: 2px;
      transform: scaleX(0);
      will-change: transform, opacity;
    }
    .curr.em { left: 0; background: linear-gradient(90deg, transparent 10%, var(--emerald)); transform-origin: left center; }
    .curr.co { right: 0; background: linear-gradient(270deg, transparent 10%, var(--coral)); transform-origin: right center; }
    .play .curr { animation: raceIn 360ms cubic-bezier(0.16, 1, 0.3, 1) 60ms both, currFade 220ms ease-out 440ms forwards; }
    @keyframes raceIn { to { transform: scaleX(1); } }
    @keyframes currFade { to { opacity: 0; } }

    /* Impact ripples */
    .ripple {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(68vmin, 520px);
      height: min(68vmin, 520px);
      margin: calc(-0.5 * min(68vmin, 520px)) 0 0 calc(-0.5 * min(68vmin, 520px));
      border-radius: 50%;
      border: 1.5px solid var(--ripple);
      opacity: 0;
      transform: scale(0.05);
      will-change: transform, opacity;
    }
    .play .ripple.r1 { animation: impactRing 440ms cubic-bezier(0.16, 1, 0.3, 1) 400ms both; }
    .play .ripple.r2 { animation: impactRing 520ms cubic-bezier(0.16, 1, 0.3, 1) 460ms both; }
    @keyframes impactRing {
      0%   { opacity: 0.9; transform: scale(0.05); }
      100% { opacity: 0; transform: scale(1.35); }
    }

    /* Wordmark centred at 50% x 50% (no trailing advance) */
    .wm-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--wm-w);
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      overflow: hidden;
    }
    .wm {
      font-family: 'BricolageGrotesque', 'Sora', 'PlusJakartaSans', sans-serif;
      font-size: calc(var(--wm-w) / 5.15);
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      display: inline-flex;
      opacity: 0;
    }
    .wm span { letter-spacing: 0.12em; }
    .wm span:last-child { letter-spacing: 0; }

    .wm.ink { color: var(--ink); }
    .wm.gh { position: absolute; inset: 0; justify-content: center; }
    .wm.gh.em { color: var(--emerald); }
    .wm.gh.co { color: var(--coral); }

    .play .wm.ink { animation: snapInk 420ms cubic-bezier(0.16, 1, 0.3, 1) 460ms both; will-change: transform, opacity; }
    .play .wm.gh.em { animation: ghostEm 480ms cubic-bezier(0.16, 1, 0.3, 1) 420ms both; will-change: transform, opacity; }
    .play .wm.gh.co { animation: ghostCo 480ms cubic-bezier(0.16, 1, 0.3, 1) 420ms both; will-change: transform, opacity; }
    @keyframes snapInk {
      0%   { opacity: 0; transform: scale(0.94); }
      40%  { opacity: 1; }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes ghostEm {
      0%   { opacity: 0.85; transform: translateX(-28px); }
      85%  { opacity: 0.7; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(0); }
    }
    @keyframes ghostCo {
      0%   { opacity: 0.85; transform: translateX(28px); }
      85%  { opacity: 0.7; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(0); }
    }

    .sheen {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 32%, rgba(255, 255, 255, 0.42) 50%, transparent 68%);
      transform: translateX(-115%);
      opacity: 0;
      pointer-events: none;
    }
    .play .sheen { animation: sheenPass 300ms ease-out 920ms both; will-change: transform, opacity; }
    @keyframes sheenPass {
      0%   { opacity: 1; transform: translateX(-115%); }
      100% { opacity: 0; transform: translateX(115%); }
    }

    /* Repeat / Lite / Reduced motion */
    .settled .wm.ink { opacity: 1; }
    .settled .curr, .settled .ripple, .settled .wm.gh, .settled .sheen { display: none; }
    .plain-exit.exiting { animation: plainFade 240ms ease-out forwards; }
    .plain-exit.exiting .half { animation: none !important; }
    @keyframes plainFade { to { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .curr, .ripple, .wm.gh, .sheen, .wm.ink { animation: none !important; }
      .wm.ink { opacity: 1; }
      .curr, .ripple, .wm.gh, .sheen { display: none; }
    }
  </style>

  <script>
    (function () {
      if (window.__settlivImpactInit) return;
      window.__settlivImpactInit = true;

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
        });
      }

      var t0 = performance.now();
      var firstFrame = false;
      var done = false;
      var seen = false;
      try { seen = sessionStorage.getItem('settliv_intro_seen') === '1'; } catch (_) {}

      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var lowEnd = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ||
                   (navigator.deviceMemory && navigator.deviceMemory <= 4);
      var lite = reduced || lowEnd;

      function sceneHtml(isTop) {
        var letters = '<span>S</span><span>E</span><span>T</span><span>T</span><span>L</span><span>I</span><span>V</span>';
        return '<div class="scene">' +
          '<div class="backdrop" aria-hidden="true"></div>' +
          '<div class="rules" aria-hidden="true"></div>' +
          '<div class="grain" aria-hidden="true"></div>' +
          '<div class="line-group" aria-hidden="true"><div class="curr em"></div><div class="curr co"></div></div>' +
          '<div class="ripple r1" aria-hidden="true"></div>' +
          '<div class="ripple r2" aria-hidden="true"></div>' +
          '<div class="wm-wrap" ' + (isTop ? 'role="img" aria-label="SETTLIV"' : 'aria-hidden="true"') + '>' +
            '<div class="wm gh em" aria-hidden="true">' + letters + '</div>' +
            '<div class="wm gh co" aria-hidden="true">' + letters + '</div>' +
            '<div class="wm ink">' + letters + '</div>' +
            '<div class="sheen" aria-hidden="true"></div>' +
          '</div>' +
        '</div>';
      }

      function finishImmediate() {
        if (done) return;
        done = true;
        var el = document.getElementById('intro');
        if (el && el.parentNode) el.parentNode.removeChild(el);
        if (document.body) document.body.classList.remove('intro-lock');
        try { sessionStorage.setItem('settliv_intro_seen', '1'); } catch (_) {}
        window.dispatchEvent(new CustomEvent('settliv-intro-reveal'));
        window.dispatchEvent(new CustomEvent('settliv-intro-done'));
      }

      function runExit(ms) {
        if (done) return;
        done = true;
        var el = document.getElementById('intro');
        if (!el) { finishImmediate(); return; }
        window.dispatchEvent(new CustomEvent('settliv-intro-reveal'));
        el.classList.add('exiting');
        try { sessionStorage.setItem('settliv_intro_seen', '1'); } catch (_) {}
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
          if (document.body) document.body.classList.remove('intro-lock');
          window.dispatchEvent(new CustomEvent('settliv-intro-done'));
        }, ms);
      }

      function tryExit() {
        if (!firstFrame || done) return;
        var elapsed = performance.now() - t0;
        if (seen) {
          if (elapsed <= 250) { finishImmediate(); return; }
          var el = document.getElementById('intro');
          if (el) el.classList.add('plain-exit');
          setTimeout(function () { runExit(240); }, Math.max(0, 200 - elapsed));
          return;
        }
        if (lite) {
          var el2 = document.getElementById('intro');
          if (el2) el2.classList.add('plain-exit');
          setTimeout(function () { runExit(240); }, Math.max(0, 250 - elapsed));
          return;
        }
        setTimeout(function () { runExit(520); }, Math.max(0, 1250 - elapsed));
      }

      window.addEventListener('pageshow', function (e) { if (e.persisted) finishImmediate(); });

      window.addEventListener('DOMContentLoaded', function () {
        if (document.hidden) { finishImmediate(); return; }
        var el = document.getElementById('intro');
        if (!el) return;
        document.body.classList.add('intro-lock');
        el.innerHTML =
          '<div class="half top">' + sceneHtml(true) + '<div class="cut-edge" aria-hidden="true"></div></div>' +
          '<div class="half bottom">' + sceneHtml(false) + '<div class="cut-edge" aria-hidden="true"></div></div>';

        if (seen || lite) {
          el.classList.add('settled');
          tryExit();
          return;
        }

        var fontGate = (document.fonts && document.fonts.load)
          ? Promise.race([
              document.fonts.load('800 1em "BricolageGrotesque"'),
              new Promise(function (r) { setTimeout(r, 500); })
            ])
          : Promise.resolve();

        fontGate.then(function () {
          requestAnimationFrame(function () {
            el.classList.add('play');
            tryExit();
          });
        });
      });

      window.addEventListener('flutter-first-frame', function () {
        firstFrame = true;
        tryExit();
      });

      setTimeout(finishImmediate, 8000);
    })();
  </script>
</head>
<body>
  <div id="intro"></div>
  <noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#070914;color:#F2F0FA;font:800 32px sans-serif;letter-spacing:.12em">SETTLIV</div></noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
