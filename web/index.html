<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Settliv — Expense Sharing & Group Ledger</title>
  <meta name="description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Settliv — Expense Sharing & Group Ledger">
  <meta property="og:description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <meta name="theme-color" content="#070A14">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Settliv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    @font-face {
      font-family: 'BricolageGrotesque';
      src: url('assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }

    :root {
      --bg: #070A14;
      --ink: #F5F7FF;
      --muted: rgba(236, 235, 245, 0.62);
      --emerald: #12B48A;
      --coral: #FF7A6B;
      --hairline: rgba(236, 235, 245, 0.085);
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      z-index: 99999;
      overflow: hidden;
      contain: layout paint;
      will-change: opacity;
      transition: opacity 250ms ease-out;
    }
    #loading-screen.reveal-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Static aurora fields that drift and rotate only via transform */
    .bg-field {
      position: absolute;
      inset: -22%;
      pointer-events: none;
      contain: layout paint;
      will-change: transform;
    }
    .bg-field.teal {
      background: radial-gradient(circle at 26% 32%, rgba(20, 184, 166, 0.18) 0%, rgba(20, 184, 166, 0) 56%);
      animation: driftA 11s ease-in-out infinite alternate;
    }
    .bg-field.emerald {
      background: radial-gradient(circle at 74% 68%, rgba(18, 180, 138, 0.14) 0%, rgba(18, 180, 138, 0) 54%);
      animation: driftB 13s ease-in-out infinite alternate;
    }
    .bg-field.peach {
      background: radial-gradient(circle at 64% 24%, rgba(255, 200, 168, 0.08) 0%, rgba(255, 200, 168, 0) 48%);
      animation: driftC 15s ease-in-out infinite alternate;
    }
    @keyframes driftA {
      from { transform: translate3d(-2%, -1.5%, 0) rotate(0deg); }
      to   { transform: translate3d(2%, 1.5%, 0) rotate(4deg); }
    }
    @keyframes driftB {
      from { transform: translate3d(2%, 1%, 0) rotate(0deg); }
      to   { transform: translate3d(-2%, -1.5%, 0) rotate(-4deg); }
    }
    @keyframes driftC {
      from { transform: translate3d(-1%, 2%, 0) rotate(0deg); }
      to   { transform: translate3d(1.5%, -1.5%, 0) rotate(3deg); }
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 38%, rgba(4, 6, 14, 0.72) 100%);
    }

    /* Hairline ring field: 6 concentric rings */
    .ring-field {
      position: absolute;
      width: 124vmax;
      height: 124vmax;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      animation: ringsEnter 0.45s var(--ease) forwards, ringsBreathe 4.2s ease-in-out 1.25s infinite alternate;
    }
    @keyframes ringsEnter {
      from { opacity: 0; transform: scale(0.76); }
      to   { opacity: 1; transform: scale(1.0); }
    }
    @keyframes ringsBreathe {
      from { transform: scale(1.0); }
      to   { transform: scale(1.025); }
    }
    .c-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid var(--hairline);
    }

    /* Centre glass orb (radial-gradient sphere, thin border, inner highlight, no blur) */
    .glass-orb {
      position: absolute;
      width: min(44vmin, 360px);
      height: min(44vmin, 360px);
      border-radius: 50%;
      border: 1px solid rgba(245, 247, 255, 0.14);
      background:
        radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 44%),
        radial-gradient(circle at 50% 54%, rgba(20, 184, 166, 0.12) 0%, rgba(13, 18, 38, 0.42) 66%, rgba(7, 10, 20, 0.65) 100%);
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      animation: orbEnter 0.45s var(--ease) forwards, orbBreathe 3.6s ease-in-out 1.25s infinite alternate;
    }
    @keyframes orbEnter {
      from { opacity: 0.4; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes orbBreathe {
      from { transform: scale(1); }
      to   { transform: scale(1.02); }
    }

    .orb-flash {
      position: absolute;
      inset: -12%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(20, 184, 166, 0.45) 0%, rgba(18, 180, 138, 0.16) 45%, transparent 72%);
      opacity: 0;
      pointer-events: none;
      contain: layout paint;
      will-change: opacity, transform;
      animation: orbPulse 0.45s var(--ease) 0.58s forwards;
    }
    @keyframes orbPulse {
      0%   { opacity: 0; transform: scale(0.85); }
      45%  { opacity: 1; transform: scale(1.06); }
      100% { opacity: 0; transform: scale(1.18); }
    }

    /* Two balance cards entering from opposite sides and converging into the orb */
    .bal-card {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(245, 247, 255, 0.16);
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.04) 100%);
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
    }
    .bal-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .bal-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .bal-dot.emerald { background: var(--emerald); }
    .bal-dot.coral { background: var(--coral); }
    .bal-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      padding-left: 14px;
      white-space: nowrap;
    }

    .bal-card.left {
      animation: cardLeft 0.8s var(--ease) forwards;
    }
    .bal-card.right {
      animation: cardRight 0.8s var(--ease) forwards;
    }
    @keyframes cardLeft {
      0%   { opacity: 0; transform: translate3d(clamp(-170px, -28vw, -110px), -26px, 0) scale(0.92); }
      52%  { opacity: 1; transform: translate3d(clamp(-125px, -18vw, -76px), -14px, 0) scale(1); }
      100% { opacity: 0; transform: translate3d(0, 0, 0) scale(0.28); }
    }
    @keyframes cardRight {
      0%   { opacity: 0; transform: translate3d(clamp(110px, 28vw, 170px), 26px, 0) scale(0.92); }
      52%  { opacity: 1; transform: translate3d(clamp(76px, 18vw, 125px), 14px, 0) scale(1); }
      100% { opacity: 0; transform: translate3d(0, 0, 0) scale(0.28); }
    }

    /* Ripple ring expanding past screen edges on convergence */
    .ripple-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 110vmax;
      height: 110vmax;
      margin: -55vmax 0 0 -55vmax;
      border-radius: 50%;
      border: 1.5px solid rgba(20, 184, 166, 0.36);
      opacity: 0;
      transform: scale(0.08);
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      animation: contactRipple 0.6s var(--ease) 0.68s forwards;
    }
    @keyframes contactRipple {
      0%   { opacity: 0.7; transform: scale(0.08); }
      100% { opacity: 0; transform: scale(1.15); }
    }

    /* Wordmark letter-by-letter + sweep + hairline */
    .brand-center {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wordmark-wrap {
      position: relative;
      overflow: hidden;
    }
    .loading-wordmark {
      display: inline-flex;
      font-family: 'BricolageGrotesque', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(34px, 5vw, 48px);
      font-weight: 800;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.24em;
      padding-left: 0.24em;
      line-height: 1;
    }
    .loading-wordmark span {
      display: inline-block;
      opacity: 0;
      transform: translateY(14px);
      will-change: transform, opacity;
      animation: letterReveal 0.28s var(--ease) forwards;
    }
    .loading-wordmark span:nth-child(1) { animation-delay: 0.80s; }
    .loading-wordmark span:nth-child(2) { animation-delay: 0.83s; }
    .loading-wordmark span:nth-child(3) { animation-delay: 0.86s; }
    .loading-wordmark span:nth-child(4) { animation-delay: 0.89s; }
    .loading-wordmark span:nth-child(5) { animation-delay: 0.92s; }
    .loading-wordmark span:nth-child(6) { animation-delay: 0.95s; }
    .loading-wordmark span:nth-child(7) { animation-delay: 0.98s; }
    @keyframes letterReveal {
      to { opacity: 1; transform: translateY(0); }
    }

    .wordmark-sweep {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 28%, rgba(255, 255, 255, 0.36) 50%, transparent 72%);
      transform: translateX(-110%);
      pointer-events: none;
      will-change: transform;
      animation: textSweep 0.55s var(--ease) 0.96s forwards;
    }
    @keyframes textSweep {
      to { transform: translateX(110%); }
    }

    .sweep-track {
      width: clamp(120px, 22vw, 190px);
      height: 1.5px;
      background-color: rgba(245, 247, 255, 0.24);
      margin-top: 16px;
      transform: scaleX(0);
      will-change: transform;
      animation: hairlineExpand 0.38s var(--ease) 0.96s forwards;
    }
    @keyframes hairlineExpand {
      to { transform: scaleX(1); }
    }

    /* Weak device variant: 1 colour field, 3 rings, no cards */
    .lite-splash .bg-field.emerald,
    .lite-splash .bg-field.peach,
    .lite-splash .c-ring.extra,
    .lite-splash .bal-card {
      display: none;
    }

    /* Reduced motion: static composed frame (aurora, orb, wordmark) + plain fade out */
    @media (prefers-reduced-motion: reduce) {
      .bg-field, .ring-field, .glass-orb, .orb-flash, .bal-card, .ripple-ring, .loading-wordmark span, .wordmark-sweep, .sweep-track {
        animation: none !important;
      }
      .ring-field, .glass-orb { opacity: 1; transform: scale(1); }
      .bal-card, .orb-flash, .ripple-ring, .wordmark-sweep { display: none; }
      .loading-wordmark span { opacity: 1; transform: none; }
      .sweep-track { transform: scaleX(1); }
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    const __splashStart = performance.now();
    const __wordmarkBeatMs = 1200;

    window.addEventListener('DOMContentLoaded', function () {
      const el = document.getElementById('loading-screen');
      if (!el) return;
      const cores = navigator.hardwareConcurrency || 8;
      const mem = navigator.deviceMemory || 8;
      if (cores <= 4 || mem <= 4) {
        el.classList.add('lite-splash');
      }
    });

    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading-screen');
      if (!loading) return;
      const elapsed = performance.now() - __splashStart;
      const waitMs = Math.max(0, __wordmarkBeatMs - elapsed);
      setTimeout(function () {
        loading.classList.add('reveal-out');
        setTimeout(function () {
          if (loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 260);
      }, waitMs);
    });
  </script>
</head>
<body>
  <div id="loading-screen">
    <div class="bg-field teal"></div>
    <div class="bg-field emerald"></div>
    <div class="bg-field peach"></div>
    <div class="vignette"></div>
    <div class="ring-field">
      <div class="c-ring" style="width:22%;height:22%"></div>
      <div class="c-ring extra" style="width:36%;height:36%"></div>
      <div class="c-ring" style="width:50%;height:50%"></div>
      <div class="c-ring extra" style="width:66%;height:66%"></div>
      <div class="c-ring" style="width:82%;height:82%"></div>
      <div class="c-ring extra" style="width:98%;height:98%"></div>
    </div>
    <div class="glass-orb">
      <div class="orb-flash"></div>
    </div>
    <div class="bal-card left">
      <div class="bal-row"><span class="bal-dot emerald"></span><span>₹1,240</span></div>
      <div class="bal-label">owed to you</div>
    </div>
    <div class="bal-card right">
      <div class="bal-row"><span class="bal-dot coral"></span><span>₹380</span></div>
      <div class="bal-label">you owe</div>
    </div>
    <div class="ripple-ring"></div>
    <div class="brand-center">
      <div class="wordmark-wrap">
        <div class="loading-wordmark"><span>S</span><span>E</span><span>T</span><span>T</span><span>L</span><span>I</span><span>V</span></div>
        <div class="wordmark-sweep"></div>
      </div>
      <div class="sweep-track"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
