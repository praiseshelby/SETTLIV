<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Settliv — Expense Sharing & Group Ledger</title>
  <meta name="description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Settliv — Expense Sharing & Group Ledger">
  <meta property="og:description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <meta name="theme-color" content="#04060D">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Settliv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    @font-face {
      font-family: 'BricolageGrotesque';
      src: url('assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }

    :root {
      --base: #04060D;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: var(--base);
      font-family: 'BricolageGrotesque', 'Sora', 'PlusJakartaSans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--base);
      z-index: 99999;
      overflow: hidden;
      contain: layout paint;
      will-change: opacity;
      backface-visibility: hidden;
    }

    #loading-screen.reveal-out {
      pointer-events: none;
      animation: splashExit 300ms ease-out forwards;
    }
    @keyframes splashExit {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    .exit-scale {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
      backface-visibility: hidden;
    }
    #loading-screen.reveal-out .exit-scale {
      animation: exitScaleUp 300ms var(--ease) forwards;
    }
    @keyframes exitScaleUp {
      from { transform: scale(1); }
      to   { transform: scale(1.03); }
    }

    /* Strong static vignette + optional faint grain */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(4, 6, 13, 0) 32%, rgba(0, 0, 0, 0.62) 100%);
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAH0lEQVQYV2NkYGD4z8DAwMgABXAGNgGwSgwVAFbmAgAw1wYFBcX5AAAAAElFTkSuQmCC");
      background-repeat: repeat;
    }

    /* Static warm & cool blooms at beam ends (opacity only) */
    .bloom-warm,
    .bloom-cool {
      position: absolute;
      inset: 0;
      pointer-events: none;
      contain: layout paint;
      will-change: opacity;
      backface-visibility: hidden;
    }
    .bloom-warm {
      opacity: 0.42;
      background: radial-gradient(circle at 26% 54%, rgba(255, 170, 110, 0.30) 0%, rgba(255, 170, 110, 0) 54%);
    }
    .bloom-cool {
      opacity: 0.42;
      background: radial-gradient(circle at 74% 46%, rgba(120, 200, 255, 0.16) 0%, rgba(120, 200, 255, 0) 52%);
    }
    #loading-screen.play .bloom-warm {
      animation: bloomPulse 0.65s var(--ease) 0.48s both, bloomIdle 3.8s ease-in-out 1.15s infinite alternate;
    }
    #loading-screen.play .bloom-cool {
      animation: bloomPulseCool 0.65s var(--ease) 0.48s both, bloomIdleCool 4.2s ease-in-out 1.15s infinite alternate;
    }
    @keyframes bloomPulse {
      0%   { opacity: 0.42; }
      25%  { opacity: 1.00; }
      100% { opacity: 0.80; }
    }
    @keyframes bloomIdle {
      from { opacity: 0.80; }
      to   { opacity: 0.86; }
    }
    @keyframes bloomPulseCool {
      0%   { opacity: 0.42; }
      25%  { opacity: 0.95; }
      100% { opacity: 0.78; }
    }
    @keyframes bloomIdleCool {
      from { opacity: 0.78; }
      to   { opacity: 0.84; }
    }

    /* Volumetric light fan below/fading before wordmark */
    .light-fan {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 110vw;
      height: 52vh;
      margin-left: -55vw;
      margin-top: -46vh;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      backface-visibility: hidden;
      opacity: 0;
      transform-origin: 50% 100%;
      background: conic-gradient(
        from 154deg at 50% 100%,
        transparent 0deg,
        rgba(255, 178, 107, 0.12) 6deg,
        transparent 12deg,
        rgba(255, 255, 255, 0.14) 20deg,
        transparent 27deg,
        rgba(143, 211, 255, 0.12) 36deg,
        transparent 44deg,
        rgba(255, 255, 255, 0.10) 50deg,
        transparent 56deg
      );
      -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.15) 36%, transparent 64%);
      mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.15) 36%, transparent 64%);
    }
    #loading-screen.play .light-fan {
      animation: fanIn 0.55s var(--ease) 0.18s both, fanDrift 5s ease-in-out 1.15s infinite alternate;
    }
    @keyframes fanIn {
      from { opacity: 0; transform: rotate(-1deg); }
      to   { opacity: 0.9; transform: rotate(0deg); }
    }
    @keyframes fanDrift {
      from { transform: rotate(0deg); }
      to   { transform: rotate(1deg); }
    }

    /* Soft elliptical legibility pad + unclipped word glow behind wordmark */
    .legibility-pad {
      position: absolute;
      width: min(76vw, 880px);
      height: 240px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -68%);
      pointer-events: none;
      background:
        radial-gradient(ellipse 68% 58% at 50% 50%, rgba(4, 6, 13, 0.62) 0%, rgba(4, 6, 13, 0) 100%),
        radial-gradient(ellipse 52% 40% at 50% 56%, rgba(255, 196, 150, 0.10) 0%, rgba(255, 196, 150, 0) 100%);
    }

    /* Wordmark stage: sits above the beam with ~0.35em gap; letters rise out of beam */
    .wordmark-stage {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: min(56vw, 760px);
      padding-bottom: 0.35em;
      overflow: hidden;
    }
    @media (max-width: 600px) {
      .wordmark-stage {
        max-width: 80vw;
      }
    }

    .loading-wordmark {
      display: inline-flex;
      font-family: 'BricolageGrotesque', 'Sora', 'PlusJakartaSans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(28px, min(8.6vw, 116px), 116px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      padding-left: 0.2em;
      line-height: 1;
      white-space: nowrap;
    }
    @media (max-width: 600px) {
      .loading-wordmark {
        font-size: clamp(28px, 9.6vw, 52px);
      }
    }

    .letter-mask {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
    }
    .letter-mask span {
      display: inline-block;
      background: linear-gradient(180deg, #FFFFFF 0%, #DCE7FF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      transform: translate3d(0, 105%, 0);
      will-change: transform, opacity;
      backface-visibility: hidden;
    }
    #loading-screen.play .letter-mask span {
      animation: letterRise 0.24s ease-out both;
    }
    #loading-screen.play .letter-mask:nth-child(1) span { animation-delay: 0.50s; }
    #loading-screen.play .letter-mask:nth-child(2) span { animation-delay: 0.54s; }
    #loading-screen.play .letter-mask:nth-child(3) span { animation-delay: 0.58s; }
    #loading-screen.play .letter-mask:nth-child(4) span { animation-delay: 0.62s; }
    #loading-screen.play .letter-mask:nth-child(5) span { animation-delay: 0.66s; }
    #loading-screen.play .letter-mask:nth-child(6) span { animation-delay: 0.70s; }
    #loading-screen.play .letter-mask:nth-child(7) span { animation-delay: 0.74s; }
    @keyframes letterRise {
      from { opacity: 0; transform: translate3d(0, 105%, 0); }
      to   { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    /* Specular sweep masked to text area */
    .wordmark-sweep {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 28%, rgba(255, 255, 255, 0.42) 50%, transparent 72%);
      transform: translate3d(-115%, 0, 0);
      pointer-events: none;
      will-change: transform;
      backface-visibility: hidden;
    }
    #loading-screen.play .wordmark-sweep {
      animation: textSweep 0.28s var(--ease) 0.90s both;
    }
    @keyframes textSweep {
      from { transform: translate3d(-115%, 0, 0); }
      to   { transform: translate3d(115%, 0, 0); }
    }

    /* The Balance Beam: pixel-aligned even box, centred transform-origin */
    .beam-pivot {
      position: relative;
      width: 70vw;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      opacity: 0;
      transform: rotate(-16deg) scaleX(0.4);
      will-change: transform, opacity;
      backface-visibility: hidden;
      contain: layout paint;
    }
    @media (max-width: 600px) {
      .beam-pivot {
        width: 80vw;
      }
    }
    #loading-screen.play .beam-pivot {
      animation:
        beamSettle 0.55s var(--ease) 0s both,
        beamContract 0.25s var(--ease) 0.90s forwards;
    }
    @keyframes beamSettle {
      0%   { opacity: 0; transform: rotate(-16deg) scaleX(0.4); }
      45%  { opacity: 1; transform: rotate(4deg) scaleX(1); }
      75%  { opacity: 1; transform: rotate(-1.5deg) scaleX(1); }
      100% { opacity: 1; transform: rotate(0deg) scaleX(1); }
    }
    @keyframes beamContract {
      from { transform: rotate(0deg) scaleX(1); }
      to   { transform: rotate(0deg) scaleX(0.68); }
    }

    .beam-glow {
      position: absolute;
      inset: 1px 0;
      height: 14px;
      border-radius: 999px;
      opacity: 0.20;
      background: linear-gradient(90deg, #FFB26B 0%, #FFFFFF 50%, #8FD3FF 100%);
    }
    .beam-core {
      position: relative;
      width: 100%;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #FFB26B 0%, #FFFFFF 50%, #8FD3FF 100%);
    }
    .beam-ruler {
      position: absolute;
      left: 6%;
      right: 6%;
      top: 5px;
      height: 6px;
      opacity: 0.18;
      background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.9) 0 1px, transparent 1px 14px);
    }
    .flare-left,
    .flare-right {
      position: absolute;
      top: 50%;
      width: 28px;
      height: 28px;
      margin-top: -14px;
      border-radius: 50%;
      pointer-events: none;
    }
    .flare-left {
      left: -14px;
      background: radial-gradient(circle, rgba(255, 178, 107, 0.85) 0%, rgba(255, 178, 107, 0) 70%);
    }
    .flare-right {
      right: -14px;
      background: radial-gradient(circle, rgba(143, 211, 255, 0.85) 0%, rgba(143, 211, 255, 0) 70%);
    }

    /* Weak device variant: no fan, no ruler, no grain, no glow duplicate */
    .lite-splash .light-fan,
    .lite-splash .beam-ruler,
    .lite-splash .grain,
    .lite-splash .beam-glow {
      display: none;
    }

    /* Reduced motion: static composed frame (level beam, wordmark) + plain fade out */
    @media (prefers-reduced-motion: reduce) {
      #loading-screen.play .bloom-warm,
      #loading-screen.play .bloom-cool,
      #loading-screen.play .light-fan,
      #loading-screen.play .letter-mask span,
      #loading-screen.play .wordmark-sweep,
      #loading-screen.play .beam-pivot {
        animation: none !important;
      }
      .bloom-warm { opacity: 0.80; }
      .bloom-cool { opacity: 0.78; }
      .light-fan, .wordmark-sweep { display: none; }
      .letter-mask span { opacity: 1; transform: none; }
      .beam-pivot { opacity: 1; transform: rotate(0deg) scaleX(0.68); }
    }
  </style>

  <script>
    if (!window.__settlivSplashInit) {
      window.__settlivSplashInit = true;

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }

      var __sequenceMs = 1150;
      var __playStart = null;
      var __firstFrameReady = false;
      var __splashRemoved = false;

      function __dismissSplash() {
        if (__splashRemoved) return;
        __splashRemoved = true;
        var loading = document.getElementById('loading-screen');
        if (!loading) return;
        loading.classList.add('reveal-out');
        setTimeout(function () {
          if (loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 310);
      }

      function __maybeDismiss() {
        if (!__firstFrameReady || __playStart === null) return;
        var elapsed = performance.now() - __playStart;
        var waitMs = Math.max(0, __sequenceMs - elapsed);
        setTimeout(__dismissSplash, waitMs);
      }

      function __startAnimation() {
        var el = document.getElementById('loading-screen');
        if (!el) return;
        var cores = navigator.hardwareConcurrency || 8;
        var mem = navigator.deviceMemory || 8;
        if (cores <= 4 || mem <= 4) {
          el.classList.add('lite-splash');
        }
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            el.classList.add('play');
            __playStart = performance.now();
            __maybeDismiss();
          });
        });
      }

      window.addEventListener('DOMContentLoaded', function () {
        var fontReady = (document.fonts && document.fonts.load)
          ? Promise.race([
              document.fonts.load('800 1em "BricolageGrotesque"'),
              new Promise(function (resolve) { setTimeout(resolve, 500); })
            ])
          : Promise.resolve();
        fontReady.then(__startAnimation, __startAnimation);
      });

      window.addEventListener('flutter-first-frame', function () {
        __firstFrameReady = true;
        __maybeDismiss();
      });

      setTimeout(__dismissSplash, 8000);
    }
  </script>
</head>
<body>
  <div id="loading-screen">
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="bloom-warm"></div>
    <div class="bloom-cool"></div>
    <div class="light-fan"></div>
    <div class="legibility-pad"></div>
    <div class="exit-scale">
      <div class="wordmark-stage">
        <div class="loading-wordmark">
          <span class="letter-mask"><span>S</span></span>
          <span class="letter-mask"><span>E</span></span>
          <span class="letter-mask"><span>T</span></span>
          <span class="letter-mask"><span>T</span></span>
          <span class="letter-mask"><span>L</span></span>
          <span class="letter-mask"><span>I</span></span>
          <span class="letter-mask"><span>V</span></span>
        </div>
        <div class="wordmark-sweep"></div>
      </div>
      <div class="beam-pivot">
        <div class="beam-glow"></div>
        <div class="beam-core"></div>
        <div class="beam-ruler"></div>
        <div class="flare-left"></div>
        <div class="flare-right"></div>
      </div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
