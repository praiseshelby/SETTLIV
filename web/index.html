<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Settliv — Expense Sharing & Group Ledger</title>
  <meta name="description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Settliv — Expense Sharing & Group Ledger">
  <meta property="og:description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <meta name="theme-color" content="#070914">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Settliv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    @font-face {
      font-family: 'BricolageGrotesque';
      src: url('assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }

    :root {
      --bg: #070914;
      --ink: #ECEBF5;
      --emerald: #4FE3B8;
      --coral: #FF8D7C;
      --hairline: rgba(236, 235, 245, 0.085);
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #0D1226 0%, #070914 78%);
      z-index: 99999;
      overflow: hidden;
      contain: layout paint;
      will-change: opacity;
      transition: opacity 300ms ease-out;
    }
    #loading-screen.reveal-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Static background radial fields with transform drift + single opacity pulse */
    .bg-field {
      position: absolute;
      inset: -14%;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
    }
    .bg-field.teal {
      background: radial-gradient(circle at 28% 34%, rgba(20, 74, 88, 0.24) 0%, rgba(20, 74, 88, 0) 54%);
      animation: fieldPulseA 1.5s var(--ease) forwards, fieldDriftA 10s ease-in-out 1.5s infinite alternate;
    }
    .bg-field.warm {
      background: radial-gradient(circle at 72% 66%, rgba(112, 60, 52, 0.14) 0%, rgba(112, 60, 52, 0) 50%);
      animation: fieldPulseB 1.5s var(--ease) forwards, fieldDriftB 12s ease-in-out 1.5s infinite alternate;
    }
    @keyframes fieldPulseA {
      0%   { opacity: 0.7; transform: translate3d(-1.5%, -1%, 0); }
      52%  { opacity: 1.0; transform: translate3d(0, 0, 0); }
      100% { opacity: 0.82; transform: translate3d(1%, 1%, 0); }
    }
    @keyframes fieldPulseB {
      0%   { opacity: 0.65; transform: translate3d(1.5%, 1%, 0); }
      52%  { opacity: 1.0; transform: translate3d(0, 0, 0); }
      100% { opacity: 0.8; transform: translate3d(-1%, -1%, 0); }
    }
    @keyframes fieldDriftA {
      from { transform: translate3d(1%, 1%, 0); }
      to   { transform: translate3d(-1.5%, -1%, 0); }
    }
    @keyframes fieldDriftB {
      from { transform: translate3d(-1%, -1%, 0); }
      to   { transform: translate3d(1.5%, 1%, 0); }
    }

    /* Viewport-spanning ring field: 1 animated wrapper + static ring divs */
    .ring-field {
      position: absolute;
      width: 130vmax;
      height: 130vmax;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      animation: ringsEnter 0.55s var(--ease) forwards, ringsBreathe 4.5s ease-in-out 1.35s infinite alternate;
    }
    @keyframes ringsEnter {
      from { opacity: 0; transform: scale(0.68); }
      to   { opacity: 1; transform: scale(1.0); }
    }
    @keyframes ringsBreathe {
      from { transform: scale(1.0); }
      to   { transform: scale(1.02); }
    }
    .c-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid var(--hairline);
    }
    .c-ring.arc {
      border-color: transparent;
      border-top-color: rgba(236, 235, 245, 0.14);
      border-right-color: rgba(79, 227, 184, 0.09);
    }

    /* Node orbit wrappers (transform rotate+scale only, counter-scale node) */
    .orbit-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(76vw, 76vh);
      height: min(76vw, 76vh);
      margin-left: calc(min(76vw, 76vh) / -2);
      margin-top: calc(min(76vw, 76vh) / -2);
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
    }
    .orbit-wrap.emerald {
      animation: orbitEmerald 0.85s var(--ease) forwards, idleSpin 10s linear 1.35s infinite;
    }
    .orbit-wrap.coral {
      animation: orbitCoral 0.85s var(--ease) forwards, idleSpinRev 12s linear 1.35s infinite;
    }
    @keyframes orbitEmerald {
      0%   { opacity: 0; transform: rotate(-35deg) scale(1.18); }
      45%  { opacity: 1; transform: rotate(95deg) scale(0.75); }
      92%  { opacity: 1; transform: rotate(215deg) scale(0.05); }
      100% { opacity: 0.85; transform: rotate(240deg) scale(0.32); }
    }
    @keyframes orbitCoral {
      0%   { opacity: 0; transform: rotate(145deg) scale(1.18); }
      45%  { opacity: 1; transform: rotate(275deg) scale(0.75); }
      92%  { opacity: 1; transform: rotate(395deg) scale(0.05); }
      100% { opacity: 0.85; transform: rotate(420deg) scale(0.32); }
    }
    @keyframes idleSpin {
      from { transform: rotate(240deg) scale(0.32); }
      to   { transform: rotate(600deg) scale(0.32); }
    }
    @keyframes idleSpinRev {
      from { transform: rotate(420deg) scale(0.32); }
      to   { transform: rotate(60deg) scale(0.32); }
    }

    .node-dot {
      position: absolute;
      top: 0;
      left: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border-radius: 50%;
    }
    .node-dot.emerald { background: var(--emerald); }
    .node-dot.coral { background: var(--coral); }
    .trail {
      position: absolute;
      top: 1px;
      left: calc(50% - 14px);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      opacity: 0.45;
    }
    .trail.emerald { background: var(--emerald); }
    .trail.coral { background: var(--coral); }

    /* Contact ripple ring expanding past screen edges */
    .ripple-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vmax;
      height: 100vmax;
      margin: -50vmax 0 0 -50vmax;
      border-radius: 50%;
      border: 1.5px solid rgba(236, 235, 245, 0.35);
      opacity: 0;
      transform: scale(0.02);
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      animation: contactRipple 0.65s var(--ease) 0.76s forwards;
    }
    @keyframes contactRipple {
      0%   { opacity: 0.65; transform: scale(0.02); }
      100% { opacity: 0; transform: scale(1.15); }
    }

    /* Wordmark letter-by-letter + sweep + hairline */
    .brand-center {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wordmark-wrap {
      position: relative;
      overflow: hidden;
    }
    .loading-wordmark {
      display: inline-flex;
      font-family: 'BricolageGrotesque', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 800;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      line-height: 1;
    }
    .loading-wordmark span {
      display: inline-block;
      opacity: 0;
      transform: translateY(14px);
      will-change: transform, opacity;
      animation: letterReveal 0.32s var(--ease) forwards;
    }
    .loading-wordmark span:nth-child(1) { animation-delay: 0.85s; }
    .loading-wordmark span:nth-child(2) { animation-delay: 0.885s; }
    .loading-wordmark span:nth-child(3) { animation-delay: 0.92s; }
    .loading-wordmark span:nth-child(4) { animation-delay: 0.955s; }
    .loading-wordmark span:nth-child(5) { animation-delay: 0.99s; }
    .loading-wordmark span:nth-child(6) { animation-delay: 1.025s; }
    .loading-wordmark span:nth-child(7) { animation-delay: 1.06s; }
    @keyframes letterReveal {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Masked light sweep across wordmark */
    .wordmark-sweep {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.35) 50%, transparent 70%);
      transform: translateX(-110%);
      pointer-events: none;
      will-change: transform;
      animation: textSweep 0.65s var(--ease) 1.05s forwards;
    }
    @keyframes textSweep {
      to { transform: translateX(110%); }
    }

    .sweep-track {
      width: clamp(120px, 22vw, 190px);
      height: 1.5px;
      background-color: rgba(236, 235, 245, 0.22);
      margin-top: 16px;
      transform: scaleX(0);
      will-change: transform;
      animation: hairlineExpand 0.42s var(--ease) 1.05s forwards;
    }
    @keyframes hairlineExpand {
      to { transform: scaleX(1); }
    }

    /* Weak device variant */
    .lite-splash .bg-field.warm,
    .lite-splash .trail,
    .lite-splash .c-ring.extra {
      display: none;
    }

    /* Reduced motion: static composed frame + plain fade out */
    @media (prefers-reduced-motion: reduce) {
      .bg-field, .ring-field, .orbit-wrap, .ripple-ring, .loading-wordmark span, .wordmark-sweep, .sweep-track {
        animation: none !important;
      }
      .ring-field { opacity: 1; transform: scale(1); }
      .orbit-wrap.emerald { opacity: 0.9; transform: rotate(270deg) scale(0.32); }
      .orbit-wrap.coral { opacity: 0.9; transform: rotate(90deg) scale(0.32); }
      .trail, .wordmark-sweep { display: none; }
      .loading-wordmark span { opacity: 1; transform: none; }
      .sweep-track { transform: scaleX(1); }
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    const __splashStart = performance.now();
    const __wordmarkBeatMs = 1200;

    window.addEventListener('DOMContentLoaded', function () {
      const el = document.getElementById('loading-screen');
      if (!el) return;
      const cores = navigator.hardwareConcurrency || 8;
      const mem = navigator.deviceMemory || 8;
      if (cores <= 4 || mem <= 4) {
        el.classList.add('lite-splash');
      }
    });

    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading-screen');
      if (!loading) return;
      const elapsed = performance.now() - __splashStart;
      const waitMs = Math.max(0, __wordmarkBeatMs - elapsed);
      setTimeout(function () {
        loading.classList.add('reveal-out');
        setTimeout(function () {
          if (loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 320);
      }, waitMs);
    });
  </script>
</head>
<body>
  <div id="loading-screen">
    <div class="bg-field teal"></div>
    <div class="bg-field warm"></div>
    <div class="ring-field">
      <div class="c-ring" style="width:18%;height:18%"></div>
      <div class="c-ring extra" style="width:28%;height:28%"></div>
      <div class="c-ring arc" style="width:38%;height:38%"></div>
      <div class="c-ring extra" style="width:48%;height:48%"></div>
      <div class="c-ring arc" style="width:58%;height:58%"></div>
      <div class="c-ring" style="width:68%;height:68%"></div>
      <div class="c-ring extra" style="width:78%;height:78%"></div>
      <div class="c-ring arc" style="width:88%;height:88%"></div>
      <div class="c-ring extra" style="width:98%;height:98%"></div>
    </div>
    <div class="orbit-wrap emerald">
      <div class="trail emerald"></div>
      <div class="node-dot emerald"></div>
    </div>
    <div class="orbit-wrap coral">
      <div class="trail coral"></div>
      <div class="node-dot coral"></div>
    </div>
    <div class="ripple-ring"></div>
    <div class="brand-center">
      <div class="wordmark-wrap">
        <div class="loading-wordmark"><span>S</span><span>E</span><span>T</span><span>T</span><span>L</span><span>I</span><span>V</span></div>
        <div class="wordmark-sweep"></div>
      </div>
      <div class="sweep-track"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
