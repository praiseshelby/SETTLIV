<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Settliv — Expense Sharing & Group Ledger</title>
  <meta name="description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Settliv — Expense Sharing & Group Ledger">
  <meta property="og:description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <meta name="theme-color" content="#070914">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Settliv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg: #070914;
      --ink: #ECEBF5;
      --muted: #A5A8C0;
      --accent: #7C5CFF;
      --emerald: #4FE3B8;
      --coral: #FF8D7C;
      --hairline: #272B4A;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      z-index: 99999;
      transition: opacity 280ms ease-out;
    }
    #loading-screen.reveal-out {
      opacity: 0;
      pointer-events: none;
    }

    .orbit-scene {
      position: relative;
      width: min(60vw, 60vh);
      height: min(60vw, 60vh);
      min-width: 210px;
      min-height: 210px;
      max-width: 560px;
      max-height: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Expanding & fading concentric rings (transform & opacity only) */
    .pulse-ring {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      border: 1px solid rgba(124, 92, 255, 0.28);
      transform: scale(0.55);
      opacity: 0;
      animation: ringExpand 3.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      pointer-events: none;
    }
    .pulse-ring.r2 { animation-delay: 1.2s; }
    .pulse-ring.r3 { animation-delay: 2.4s; }

    @keyframes ringExpand {
      0% { transform: scale(0.50); opacity: 0.48; }
      100% { transform: scale(1.05); opacity: 0; }
    }

    /* Orbit tracks */
    .orbit-track {
      position: absolute;
      border-radius: 50%;
      border: 1px solid var(--hairline);
      pointer-events: none;
    }
    .orbit-track.outer { inset: 12%; }
    .orbit-track.inner { inset: 24%; border-color: rgba(124, 92, 255, 0.25); }

    /* Rotating node carriers */
    .orbit-carrier {
      position: absolute;
      inset: 12%;
      animation: orbitSpin 4.8s linear infinite;
      pointer-events: none;
    }
    .orbit-carrier.inner {
      inset: 24%;
      animation: orbitSpinReverse 3.6s linear infinite;
    }
    @keyframes orbitSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbitSpinReverse {
      from { transform: rotate(180deg); }
      to { transform: rotate(-180deg); }
    }

    .orbit-node {
      position: absolute;
      top: -5px;
      left: 50%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      border-radius: 50%;
    }
    .orbit-node.emerald {
      background: var(--emerald);
      box-shadow: 0 0 12px rgba(79, 227, 184, 0.55);
    }
    .orbit-node.coral {
      background: var(--coral);
      box-shadow: 0 0 12px rgba(255, 141, 124, 0.55);
    }

    /* Wordmark with slow light sweep */
    .brand-center {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .loading-wordmark {
      font-size: clamp(32px, 5vw, 44px);
      font-weight: 800;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.26em;
      padding-left: 0.26em;
      line-height: 1;
      background: linear-gradient(110deg, var(--ink) 35%, #ffffff 50%, var(--ink) 65%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: wordmarkSweep 2.4s ease-in-out infinite;
    }
    @keyframes wordmarkSweep {
      0% { background-position: 120% 0; }
      100% { background-position: -120% 0; }
    }

    /* Thin progress hairline */
    .sweep-track {
      position: relative;
      width: clamp(120px, 22vw, 180px);
      height: 1.5px;
      background-color: var(--hairline);
      margin-top: 16px;
      overflow: hidden;
      border-radius: 1px;
    }
    .sweep-bar {
      position: absolute;
      inset: 0;
      width: 45%;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: sweepLine 1.5s ease-in-out infinite;
    }
    @keyframes sweepLine {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(260%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse-ring, .orbit-carrier, .orbit-carrier.inner, .loading-wordmark, .sweep-bar {
        animation: none;
      }
      .pulse-ring { opacity: 0.22; transform: scale(0.88); }
      .loading-wordmark {
        background: none;
        -webkit-text-fill-color: var(--ink);
        color: var(--ink);
      }
      .sweep-bar { transform: translateX(60%); }
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading-screen');
      if (loading) {
        loading.classList.add('reveal-out');
        setTimeout(function () {
          if (loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 300);
      }
    });
  </script>
</head>
<body>
  <div id="loading-screen">
    <div class="orbit-scene">
      <div class="pulse-ring"></div>
      <div class="pulse-ring r2"></div>
      <div class="pulse-ring r3"></div>
      <div class="orbit-track outer"></div>
      <div class="orbit-track inner"></div>
      <div class="orbit-carrier"><div class="orbit-node emerald"></div></div>
      <div class="orbit-carrier inner"><div class="orbit-node coral"></div></div>
      <div class="brand-center">
        <div class="loading-wordmark">SETTLIV</div>
        <div class="sweep-track"><div class="sweep-bar"></div></div>
      </div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
