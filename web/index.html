<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Settliv — Expense Sharing & Group Ledger</title>
  <meta name="description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Settliv — Expense Sharing & Group Ledger">
  <meta property="og:description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <!-- Theme color for light and dark -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F7FC">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070914">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Settliv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg: #F6F7FC;
      --ink: #12132B;
      --muted: #5A5F7A;
      --accent: #5B4BDB;
      --emerald: #0FA37F;
      --coral: #EF5B48;
      --hairline: #E3E5F1;
      --sweep-glow: rgba(91, 75, 219, 0.4);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #070914;
        --ink: #ECEBF5;
        --muted: #A5A8C0;
        --accent: #7C5CFF;
        --emerald: #4FE3B8;
        --coral: #FF8D7C;
        --hairline: #272B4A;
        --sweep-glow: rgba(124, 92, 255, 0.5);
      }
    }
    body {
      margin: 0;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      z-index: 99999;
      clip-path: circle(150% at 50% 50%);
      transition: clip-path 450ms cubic-bezier(0.16, 1, 0.3, 1), opacity 450ms ease-out;
    }
    #loading-screen.reveal-out {
      clip-path: circle(0% at 50% 50%);
      opacity: 0;
      pointer-events: none;
    }

    .settle-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* SVG Settle Animation */
    .settle-svg {
      width: 140px;
      height: 100px;
      overflow: visible;
    }
    .settle-ring {
      fill: none;
      stroke: var(--hairline);
      stroke-width: 1px;
    }
    .settle-guide {
      stroke: var(--hairline);
      stroke-width: 1px;
      stroke-dasharray: 4 4;
    }
    .settle-level-line {
      stroke: var(--muted);
      stroke-width: 1.2px;
      transform-origin: 70px 50px;
      animation: balanceRock 2.4s ease-in-out infinite;
    }
    .node-owed {
      fill: var(--emerald);
      transform-origin: 70px 50px;
      animation: convergeOwed 2.0s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    .node-owe {
      fill: var(--coral);
      transform-origin: 70px 50px;
      animation: convergeOwe 2.0s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }

    @keyframes convergeOwed {
      0% {
        transform: translate(-36px, -18px);
        opacity: 0.2;
      }
      50% {
        transform: translate(-12px, 0px);
        opacity: 1;
      }
      100% {
        transform: translate(-12px, 0px);
        opacity: 1;
      }
    }
    @keyframes convergeOwe {
      0% {
        transform: translate(36px, 18px);
        opacity: 0.2;
      }
      50% {
        transform: translate(12px, 0px);
        opacity: 1;
      }
      100% {
        transform: translate(12px, 0px);
        opacity: 1;
      }
    }
    @keyframes balanceRock {
      0%, 100% {
        transform: rotate(0deg);
      }
      25% {
        transform: rotate(-3.5deg);
      }
      75% {
        transform: rotate(2.5deg);
      }
      85% {
        transform: rotate(0deg);
      }
    }

    /* Wordmark resolving from 0.6em to 0.18em tracking */
    .loading-wordmark {
      font-size: 26px;
      font-weight: 800;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.6em;
      margin-top: 12px;
      animation: settleTracking 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes settleTracking {
      0% {
        letter-spacing: 0.6em;
        opacity: 0.3;
      }
      100% {
        letter-spacing: 0.18em;
        opacity: 1;
      }
    }

    /* Indeterminate hairline sweep underneath */
    .sweep-track {
      position: relative;
      width: 120px;
      height: 1px;
      background-color: var(--hairline);
      margin-top: 14px;
      overflow: hidden;
      border-radius: 1px;
    }
    .sweep-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 48px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      box-shadow: 0 0 8px var(--sweep-glow);
      animation: sweepLine 1.6s ease-in-out infinite;
    }
    @keyframes sweepLine {
      0% {
        left: -48px;
      }
      100% {
        left: 120px;
      }
    }

    /* Reduced motion adjustments */
    @media (prefers-reduced-motion: reduce) {
      .settle-level-line, .node-owed, .node-owe, .sweep-bar {
        animation: none;
      }
      .loading-wordmark {
        animation: none;
        letter-spacing: 0.18em;
      }
      #loading-screen {
        transition: opacity 200ms ease-out;
      }
      #loading-screen.reveal-out {
        clip-path: none;
        opacity: 0;
      }
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading-screen');
      if (loading) {
        loading.classList.add('reveal-out');
        setTimeout(function() {
          if (loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 480);
      }
    });
  </script>
</head>
<body>
  <div id="loading-screen">
    <div class="settle-container">
      <svg class="settle-svg" viewBox="0 0 140 100">
        <!-- Concentric rings -->
        <circle class="settle-ring" cx="70" cy="50" r="42" />
        <circle class="settle-ring" cx="70" cy="50" r="26" />
        <!-- Leveling guide -->
        <line class="settle-guide" x1="16" y1="50" x2="124" y2="50" />
        <!-- Balancing line -->
        <g class="settle-level-line">
          <line x1="28" y1="50" x2="112" y2="50" />
          <circle cx="70" cy="50" r="2" fill="var(--muted)" />
          <!-- Converging nodes -->
          <circle class="node-owed" cx="70" cy="50" r="4.5" />
          <circle class="node-owe" cx="70" cy="50" r="4.5" />
        </g>
      </svg>
      <div class="loading-wordmark">SETTLIV</div>
      <div class="sweep-track">
        <div class="sweep-bar"></div>
      </div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
