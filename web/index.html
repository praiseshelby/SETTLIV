<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Settliv — Expense Sharing & Group Ledger</title>
  <meta name="description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Settliv — Expense Sharing & Group Ledger">
  <meta property="og:description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <meta name="theme-color" content="#070A14">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Settliv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    @font-face {
      font-family: 'BricolageGrotesque';
      src: url('assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }

    :root {
      --bg-deep: #070A14;
      --bg-mid: #0B1020;
      --hairline: rgba(235, 240, 255, 0.08);
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-deep);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(155deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
      z-index: 99999;
      overflow: hidden;
      contain: layout paint;
      will-change: opacity;
      transition: opacity 300ms ease-out;
    }
    #loading-screen.reveal-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Static oversized radial-gradient colour fields (ice + lavender), transform drift only */
    .bg-field {
      position: absolute;
      inset: -20%;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
    }
    .bg-field.ice {
      background: radial-gradient(circle at 24% 28%, rgba(159, 216, 255, 0.085) 0%, rgba(159, 216, 255, 0) 54%);
      animation: driftIce 14s ease-in-out infinite alternate;
    }
    .bg-field.lavender {
      background: radial-gradient(circle at 76% 70%, rgba(185, 180, 255, 0.095) 0%, rgba(185, 180, 255, 0) 56%);
      animation: driftLav 16s ease-in-out infinite alternate;
    }
    @keyframes driftIce {
      from { transform: translate3d(-1.5%, -1%, 0); }
      to   { transform: translate3d(1.5%, 1.5%, 0); }
    }
    @keyframes driftLav {
      from { transform: translate3d(1.5%, 1%, 0); }
      to   { transform: translate3d(-1.5%, -1.5%, 0); }
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(4, 6, 14, 0.72) 100%);
    }

    /* Faint static grain (tiny tiled PNG at ~4% opacity) */
    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAH0lEQVQYV2NkYGD4z8DAwMgABXAGNgGwSgwVAFbmAgAw1wYFBcX5AAAAAElFTkSuQmCC");
      background-repeat: repeat;
    }

    /* Two large hairline rings behind planes, breathing by 2% */
    .ring-field {
      position: absolute;
      width: 132vmax;
      height: 132vmax;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      opacity: 0;
      animation: ringsFade 0.5s var(--ease) forwards, ringsBreathe 5s ease-in-out 1.2s infinite alternate;
    }
    @keyframes ringsFade {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes ringsBreathe {
      from { transform: scale(1); }
      to   { transform: scale(1.02); }
    }
    .c-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid var(--hairline);
    }

    /* 3 layered frosted-glass planes (no backdrop-filter, static gradient border + highlight + shadow) */
    .glass-plane {
      position: absolute;
      border: 1px solid transparent;
      background:
        linear-gradient(145deg, rgba(245, 248, 255, 0.085) 0%, rgba(245, 248, 255, 0.045) 100%) padding-box,
        linear-gradient(145deg, rgba(255, 255, 255, 0.30) 0%, rgba(255, 255, 255, 0.03) 100%) border-box;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 24px 64px rgba(3, 5, 16, 0.45);
      pointer-events: none;
      overflow: hidden;
      contain: layout paint;
      will-change: transform, opacity;
      transition: transform 300ms var(--ease), opacity 300ms ease-out;
    }
    .plane-a {
      width: clamp(240px, 44vw, 560px);
      height: clamp(160px, 28vh, 300px);
      top: 10%;
      left: -6%;
      border-radius: 34px;
      animation: planeAIn 0.5s var(--ease) forwards, planeADrift 9s ease-in-out 1.2s infinite alternate;
    }
    .plane-b {
      width: clamp(260px, 48vw, 620px);
      height: clamp(180px, 32vh, 340px);
      bottom: 8%;
      right: -8%;
      border-radius: 40px;
      animation: planeBIn 0.5s var(--ease) forwards, planeBDrift 11s ease-in-out 1.2s infinite alternate;
    }
    .plane-c {
      width: clamp(220px, 38vw, 480px);
      height: clamp(140px, 24vh, 260px);
      top: 52%;
      left: 14%;
      border-radius: 28px;
      animation: planeCIn 0.5s var(--ease) forwards, planeCDrift 10s ease-in-out 1.2s infinite alternate;
    }
    @keyframes planeAIn {
      from { opacity: 0; transform: translate3d(-44px, -22px, 0) rotate(-8deg); }
      to   { opacity: 1; transform: translate3d(0, 0, 0) rotate(-5deg); }
    }
    @keyframes planeBIn {
      from { opacity: 0; transform: translate3d(48px, 24px, 0) rotate(8deg); }
      to   { opacity: 1; transform: translate3d(0, 0, 0) rotate(5deg); }
    }
    @keyframes planeCIn {
      from { opacity: 0; transform: translate3d(-24px, 36px, 0) rotate(-3deg); }
      to   { opacity: 1; transform: translate3d(0, 0, 0) rotate(2deg); }
    }
    @keyframes planeADrift {
      from { transform: translate3d(0, 0, 0) rotate(-5deg); }
      to   { transform: translate3d(1.5%, 1%, 0) rotate(-4.2deg); }
    }
    @keyframes planeBDrift {
      from { transform: translate3d(0, 0, 0) rotate(5deg); }
      to   { transform: translate3d(-1.5%, -1%, 0) rotate(4.2deg); }
    }
    @keyframes planeCDrift {
      from { transform: translate3d(0, 0, 0) rotate(2deg); }
      to   { transform: translate3d(1%, -1.5%, 0) rotate(2.6deg); }
    }

    #loading-screen.reveal-out .plane-a { opacity: 0; transform: scale(1.15) rotate(-5deg); }
    #loading-screen.reveal-out .plane-b { opacity: 0; transform: scale(1.15) rotate(5deg); }
    #loading-screen.reveal-out .plane-c { opacity: 0; transform: scale(1.15) rotate(2deg); }

    /* Diagonal light streaks + edge glint */
    .light-streak {
      position: absolute;
      top: -30%;
      left: 0;
      width: 28vw;
      min-width: 180px;
      height: 160%;
      background: linear-gradient(90deg, transparent 0%, rgba(235, 246, 255, 0.08) 50%, transparent 100%);
      transform: translate3d(-60vw, 0, 0) rotate(-20deg);
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
    }
    .light-streak.one { animation: streakSweep 0.55s var(--ease) 0.85s forwards; }
    .light-streak.two { width: 16vw; opacity: 0.7; animation: streakSweep 0.62s var(--ease) 0.92s forwards; }
    @keyframes streakSweep {
      0%   { opacity: 0; transform: translate3d(-60vw, 0, 0) rotate(-20deg); }
      35%  { opacity: 1; }
      100% { opacity: 0; transform: translate3d(135vw, 0, 0) rotate(-20deg); }
    }

    /* Wordmark + fake motion-blur ghosts + light sweep + hairline */
    .brand-center {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wordmark-stage {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .wordmark-typo {
      font-family: 'BricolageGrotesque', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(40px, 6vw, 64px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      padding-left: 0.22em;
      line-height: 1;
      white-space: nowrap;
    }
    .ghost-wordmark {
      position: absolute;
      inset: 0;
      color: rgba(235, 244, 255, 0.9);
      pointer-events: none;
      opacity: 0;
      contain: layout paint;
      will-change: transform, opacity;
    }
    .ghost-wordmark.g1 { animation: ghostBlur1 0.52s var(--ease) 0.35s forwards; }
    .ghost-wordmark.g2 { animation: ghostBlur2 0.52s var(--ease) 0.35s forwards; }
    @keyframes ghostBlur1 {
      0%   { opacity: 0.22; transform: translate3d(0, 30px, 0) scaleY(1.12); }
      100% { opacity: 0; transform: translate3d(0, 0, 0) scaleY(1); }
    }
    @keyframes ghostBlur2 {
      0%   { opacity: 0.10; transform: translate3d(0, 36px, 0) scaleY(1.16); }
      100% { opacity: 0; transform: translate3d(0, 0, 0) scaleY(1); }
    }

    .loading-wordmark {
      display: inline-flex;
    }
    .loading-wordmark span {
      display: inline-block;
      background: linear-gradient(180deg, #FFFFFF 0%, #D9E6FF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      transform: translateY(28px);
      will-change: transform, opacity;
      animation: letterRise 0.36s var(--ease) forwards;
    }
    .loading-wordmark span:nth-child(1) { animation-delay: 0.35s; }
    .loading-wordmark span:nth-child(2) { animation-delay: 0.38s; }
    .loading-wordmark span:nth-child(3) { animation-delay: 0.41s; }
    .loading-wordmark span:nth-child(4) { animation-delay: 0.44s; }
    .loading-wordmark span:nth-child(5) { animation-delay: 0.47s; }
    .loading-wordmark span:nth-child(6) { animation-delay: 0.50s; }
    .loading-wordmark span:nth-child(7) { animation-delay: 0.53s; }
    @keyframes letterRise {
      to { opacity: 1; transform: translateY(0); }
    }

    .wordmark-sweep {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 26%, rgba(255, 255, 255, 0.42) 50%, transparent 74%);
      transform: translateX(-115%);
      pointer-events: none;
      will-change: transform;
      animation: textSweep 0.45s var(--ease) 0.85s forwards;
    }
    @keyframes textSweep {
      to { transform: translateX(115%); }
    }

    .sweep-track {
      width: clamp(130px, 24vw, 220px);
      height: 1.5px;
      background-color: rgba(235, 244, 255, 0.28);
      margin-top: 18px;
      transform: scaleX(0);
      will-change: transform;
      animation: hairlineExpand 0.35s var(--ease) 0.88s forwards;
    }
    @keyframes hairlineExpand {
      to { transform: scaleX(1); }
    }

    /* Weak device variant: 2 planes, no ghosts, no grain */
    .lite-splash .plane-c,
    .lite-splash .ghost-wordmark,
    .lite-splash .grain {
      display: none;
    }

    /* Reduced motion: static composed frame (planes, wordmark) + plain fade out */
    @media (prefers-reduced-motion: reduce) {
      .bg-field, .ring-field, .glass-plane, .light-streak, .ghost-wordmark, .loading-wordmark span, .wordmark-sweep, .sweep-track {
        animation: none !important;
      }
      .ring-field { opacity: 1; transform: scale(1); }
      .plane-a { opacity: 1; transform: rotate(-5deg); }
      .plane-b { opacity: 1; transform: rotate(5deg); }
      .plane-c { opacity: 1; transform: rotate(2deg); }
      .light-streak, .ghost-wordmark, .wordmark-sweep { display: none; }
      .loading-wordmark span { opacity: 1; transform: none; }
      .sweep-track { transform: scaleX(1); }
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    const __splashStart = performance.now();
    const __wordmarkBeatMs = 1200;

    window.addEventListener('DOMContentLoaded', function () {
      const el = document.getElementById('loading-screen');
      if (!el) return;
      const cores = navigator.hardwareConcurrency || 8;
      const mem = navigator.deviceMemory || 8;
      if (cores <= 4 || mem <= 4) {
        el.classList.add('lite-splash');
      }
    });

    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading-screen');
      if (!loading) return;
      const elapsed = performance.now() - __splashStart;
      const waitMs = Math.max(0, __wordmarkBeatMs - elapsed);
      setTimeout(function () {
        loading.classList.add('reveal-out');
        setTimeout(function () {
          if (loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 310);
      }, waitMs);
    });
  </script>
</head>
<body>
  <div id="loading-screen">
    <div class="bg-field ice"></div>
    <div class="bg-field lavender"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="ring-field">
      <div class="c-ring" style="width:58%;height:58%"></div>
      <div class="c-ring" style="width:94%;height:94%"></div>
    </div>
    <div class="glass-plane plane-a"></div>
    <div class="glass-plane plane-b"></div>
    <div class="glass-plane plane-c"></div>
    <div class="light-streak one"></div>
    <div class="light-streak two"></div>
    <div class="brand-center">
      <div class="wordmark-stage">
        <div class="wordmark-typo ghost-wordmark g1" aria-hidden="true">SETTLIV</div>
        <div class="wordmark-typo ghost-wordmark g2" aria-hidden="true">SETTLIV</div>
        <div class="wordmark-typo loading-wordmark"><span>S</span><span>E</span><span>T</span><span>T</span><span>L</span><span>I</span><span>V</span></div>
        <div class="wordmark-sweep"></div>
      </div>
      <div class="sweep-track"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
