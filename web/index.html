<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <meta property="og:title" content="Settliv — Expense Sharing & Group Ledger">
  <meta property="og:description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <meta name="theme-color" content="#04060D">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    @font-face {
      font-family: 'BricolageGrotesque';
      src: url('assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }

    :root {
      --base: #04060D;
      --ease: cubic-bezier(.2, .8, .2, 1);
      --ring-a: max(135vmin, 980px);
      --ring-b: max(105vmin, 780px);
    }
    @media (max-width: 600px) {
      :root {
        --ring-a: 94vw;
        --ring-b: 78vw;
      }
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: var(--base);
      font-family: 'BricolageGrotesque', 'Sora', 'PlusJakartaSans', sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--base);
      z-index: 99999;
      overflow: hidden;
      contain: layout paint;
      will-change: opacity;
      backface-visibility: hidden;
    }
    #loading-screen.reveal-out {
      pointer-events: none;
      animation: splashExit 300ms ease-out forwards;
    }
    @keyframes splashExit {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(4, 6, 13, 0) 30%, rgba(0, 0, 0, 0.58) 100%);
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAH0lEQVQYV2NkYGD4z8DAwMgABXAGNgGwSgwVAFbmAgAw1wYFBcX5AAAAAElFTkSuQmCC");
      background-repeat: repeat;
    }

    /* 6 soft bokeh discs in outer 30% of viewport width (behind everything) */
    .bokeh {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      backface-visibility: hidden;
      opacity: 0;
    }
    .bokeh.w1 { width: 240px; height: 240px; top: 12%; left: 3%; background: radial-gradient(circle, rgba(255,178,107,0.13) 0%, transparent 70%); }
    .bokeh.w2 { width: 140px; height: 140px; top: 62%; left: 8%; background: radial-gradient(circle, rgba(255,170,110,0.10) 0%, transparent 70%); }
    .bokeh.w3 { width: 96px;  height: 96px;  bottom: 10%; left: 16%; background: radial-gradient(circle, rgba(255,217,168,0.08) 0%, transparent 70%); }
    .bokeh.c1 { width: 250px; height: 250px; bottom: 10%; right: 3%; background: radial-gradient(circle, rgba(143,211,255,0.13) 0%, transparent 70%); }
    .bokeh.c2 { width: 150px; height: 150px; top: 18%; right: 7%; background: radial-gradient(circle, rgba(120,200,255,0.10) 0%, transparent 70%); }
    .bokeh.c3 { width: 90px;  height: 90px;  top: 54%; right: 15%; background: radial-gradient(circle, rgba(220,231,255,0.07) 0%, transparent 70%); }
    #loading-screen.play .bokeh.w1 { animation: bokehIn 0.6s var(--ease) 0s both, driftB1 10s ease-in-out 1.1s infinite alternate; }
    #loading-screen.play .bokeh.w2 { animation: bokehIn 0.6s var(--ease) 0s both, driftB2 12s ease-in-out 1.1s infinite alternate; }
    #loading-screen.play .bokeh.w3 { animation: bokehIn 0.6s var(--ease) 0s both, driftB3 14s ease-in-out 1.1s infinite alternate; }
    #loading-screen.play .bokeh.c1 { animation: bokehIn 0.6s var(--ease) 0s both, driftB2 11s ease-in-out 1.1s infinite alternate; }
    #loading-screen.play .bokeh.c2 { animation: bokehIn 0.6s var(--ease) 0s both, driftB1 13s ease-in-out 1.1s infinite alternate; }
    #loading-screen.play .bokeh.c3 { animation: bokehIn 0.6s var(--ease) 0s both, driftB3 15s ease-in-out 1.1s infinite alternate; }
    @keyframes bokehIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes driftB1 { from { transform: translate3d(-14px, -10px, 0); } to { transform: translate3d(14px, 12px, 0); } }
    @keyframes driftB2 { from { transform: translate3d(18px, -12px, 0); } to { transform: translate3d(-16px, 14px, 0); } }
    @keyframes driftB3 { from { transform: translate3d(-24px, 16px, 0); } to { transform: translate3d(24px, -16px, 0); } }

    /* Giant outline typography texture rows (1.6 wordmark-heights above & below) */
    .outline-row {
      position: absolute;
      left: 50%;
      font-family: 'BricolageGrotesque', 'Sora', 'PlusJakartaSans', sans-serif;
      font-size: clamp(64px, 13vw, 176px);
      font-weight: 800;
      letter-spacing: 0.14em;
      line-height: 1;
      white-space: nowrap;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.055);
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      backface-visibility: hidden;
      opacity: 0;
    }
    .outline-row.top {
      top: calc(50% - min(18vw, 220px));
      margin-left: -48vw;
      transform: translate3d(-20px, -50%, 0);
    }
    .outline-row.bottom {
      top: calc(50% + min(18vw, 220px));
      margin-left: -48vw;
      transform: translate3d(20px, -50%, 0);
    }
    @media (max-width: 600px) {
      .outline-row.top { top: calc(50% - 125px); }
      .outline-row.bottom { top: calc(50% + 125px); }
    }
    #loading-screen.play .outline-row.top {
      animation: outlineIn 0.6s var(--ease) 0.15s both, outlineDriftR 16s linear 1.1s infinite alternate;
    }
    #loading-screen.play .outline-row.bottom {
      animation: outlineIn 0.6s var(--ease) 0.15s both, outlineDriftL 16s linear 1.1s infinite alternate;
    }
    @keyframes outlineIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes outlineDriftR { from { transform: translate3d(-20px, -50%, 0); } to { transform: translate3d(20px, -50%, 0); } }
    @keyframes outlineDriftL { from { transform: translate3d(20px, -50%, 0); } to { transform: translate3d(-20px, -50%, 0); } }

    /* Asymmetric off-centre warm & cool light leaks */
    .bg-leaks {
      position: absolute;
      inset: -8%;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      backface-visibility: hidden;
      opacity: 0.45;
      background:
        radial-gradient(circle at 14% 16%, rgba(255, 170, 110, 0.28) 0%, rgba(255, 170, 110, 0) 54%),
        radial-gradient(circle at 86% 84%, rgba(120, 200, 255, 0.18) 0%, rgba(120, 200, 255, 0) 54%);
    }
    #loading-screen.play .bg-leaks {
      animation: leaksBloom 0.55s var(--ease) 0s both, leaksParallax 9s ease-in-out 1.10s infinite alternate;
    }
    @keyframes leaksBloom {
      from { opacity: 0.45; transform: translate3d(0, 0, 0); }
      to   { opacity: 1.00; transform: translate3d(0, 0, 0); }
    }
    @keyframes leaksParallax {
      from { transform: translate3d(-1%, -0.8%, 0); }
      to   { transform: translate3d(1%, 0.8%, 0); }
    }

    /* Unclipped soft warm radial glow + elliptical legibility pad behind wordmark */
    .warm-word-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 54% 40% at 50% 50%, rgba(4, 6, 13, 0.62) 0%, rgba(4, 6, 13, 0) 100%),
        radial-gradient(circle at 50% 50%, rgba(255, 170, 110, 0.14) 0%, rgba(255, 170, 110, 0) 48%);
    }

    .bezel-svg {
      position: absolute;
      width: var(--ring-a);
      height: var(--ring-a);
      pointer-events: none;
      contain: layout paint;
      will-change: transform;
      backface-visibility: hidden;
      opacity: 0.14;
    }
    #loading-screen.play .bezel-svg {
      animation: bezelSpin 64s linear 0s infinite;
    }
    @keyframes bezelSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .rings-shell {
      position: absolute;
      width: var(--ring-a);
      height: var(--ring-a);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      backface-visibility: hidden;
      opacity: 0;
      transform: scale(0.8);
    }
    #loading-screen.play .rings-shell {
      animation: ringsEnter 0.55s var(--ease) 0s both, ringsParallax 11s ease-in-out 1.10s infinite alternate;
    }
    #loading-screen.reveal-out .rings-shell {
      animation: ringsExit 300ms var(--ease) forwards;
    }
    @keyframes ringsEnter {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes ringsParallax {
      from { transform: translate3d(0.6%, 0.4%, 0) scale(1); }
      to   { transform: translate3d(-0.6%, -0.4%, 0) scale(1); }
    }
    @keyframes ringsExit {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(1.4); }
    }

    /* Rim-lit Ring A: amber head starts on the LEFT (270deg) */
    .ring-a-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }
    #loading-screen.play .ring-a-wrap {
      animation:
        ringARamp 0.55s var(--ease) 0s both,
        ringAPulse 0.25s var(--ease) 0.85s,
        ringAIdle 24s linear 0.55s infinite;
    }
    @keyframes ringARamp {
      from { transform: rotate(-200deg); }
      to   { transform: rotate(0deg); }
    }
    @keyframes ringAPulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.68; }
    }
    @keyframes ringAIdle {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Rim-lit Ring B: ice head starts on the RIGHT (180deg offset from amber) */
    .ring-b {
      position: absolute;
      width: var(--ring-b);
      height: var(--ring-b);
      border-radius: 50%;
      pointer-events: none;
      contain: layout paint;
      will-change: transform;
      backface-visibility: hidden;
      border: 2px solid rgba(143, 211, 255, 0.42);
    }
    #loading-screen.play .ring-b {
      animation:
        ringBRamp 0.55s var(--ease) 0s both,
        ringBIdle 28s linear 0.55s infinite;
    }
    @keyframes ringBRamp {
      from { transform: rotate(190deg); }
      to   { transform: rotate(0deg); }
    }
    @keyframes ringBIdle {
      from { transform: rotate(360deg); }
      to   { transform: rotate(0deg); }
    }

    .ring-a-core,
    .ring-a-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 178, 107, 0.50);
    }
    .ring-a-glow {
      opacity: 0.20;
      border-width: 8px;
    }

    @supports ((mask: radial-gradient(#000, #000)) or (-webkit-mask: radial-gradient(#000, #000))) and (background: conic-gradient(red, blue)) {
      .ring-a-core {
        border: 0;
        background: conic-gradient(
          from 165deg,
          transparent 0deg 40deg,
          rgba(255, 178, 107, 0.35) 95deg,
          #FFB26B 145deg,
          #FFF1DC 185deg,
          rgba(255, 241, 220, 0.35) 205deg,
          transparent 230deg 360deg
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0);
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0);
      }
      .ring-a-glow {
        border: 0;
        background: conic-gradient(
          from 165deg,
          transparent 0deg 40deg,
          rgba(255, 178, 107, 0.35) 95deg,
          #FFB26B 145deg,
          #FFF1DC 185deg,
          rgba(255, 241, 220, 0.35) 205deg,
          transparent 230deg 360deg
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 16px), #000 0);
        mask: radial-gradient(farthest-side, transparent calc(100% - 16px), #000 0);
      }
      .ring-b {
        border: 0;
        background: conic-gradient(
          from 345deg,
          transparent 0deg 40deg,
          rgba(143, 211, 255, 0.35) 95deg,
          #8FD3FF 145deg,
          #FFFFFF 185deg,
          rgba(255, 255, 255, 0.35) 205deg,
          transparent 230deg 360deg
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
      }
    }

    .streak-diag {
      position: absolute;
      top: 50%;
      left: -10vw;
      width: 120vw;
      height: 2px;
      margin-top: -1px;
      background: linear-gradient(90deg, transparent 0%, #FFD9A8 30%, #FFFFFF 50%, #8FD3FF 70%, transparent 100%);
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      backface-visibility: hidden;
      opacity: 0;
      transform: rotate(-8deg) scaleX(0);
    }
    #loading-screen.play .streak-diag {
      animation: streakCross 0.20s var(--ease) 0.30s both;
    }
    @keyframes streakCross {
      0%   { opacity: 0; transform: rotate(-8deg) scaleX(0); }
      45%  { opacity: 1; transform: rotate(-8deg) scaleX(1); }
      100% { opacity: 0; transform: rotate(-8deg) scaleX(1); }
    }

    /* Wordmark: larger, tighter tracking 0.14em, dimensional fill + 1px top edge + glossy reflection */
    .brand-center {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 60vw;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }
    @media (max-width: 600px) {
      .brand-center {
        max-width: 82vw;
      }
    }
    #loading-screen.reveal-out .brand-center {
      animation: wordExit 300ms var(--ease) forwards;
    }
    @keyframes wordExit {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(1.03); }
    }

    .wordmark-stage {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .wordmark-typo {
      font-family: 'BricolageGrotesque', 'Sora', 'PlusJakartaSans', sans-serif;
      font-size: clamp(24px, min(9.2vw, 132px), 132px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      padding-left: 0.14em;
      line-height: 1.04;
      white-space: nowrap;
    }
    @media (max-width: 600px) {
      .wordmark-typo {
        font-size: clamp(24px, 7.6vw, 44px);
      }
    }

    .loading-wordmark {
      display: inline-flex;
    }
    .letter-mask {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
    }
    .letter-mask span {
      position: relative;
      display: inline-block;
      background: linear-gradient(180deg, #FFFFFF 0%, #E6ECFF 52%, #9FAACB 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      transform: translate3d(0, 105%, 0);
      will-change: transform, opacity;
      backface-visibility: hidden;
    }
    .letter-mask span::after {
      content: attr(data-ch);
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 7%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      pointer-events: none;
    }
    #loading-screen.play .letter-mask span {
      animation: letterUp 0.26s var(--ease) both;
    }
    #loading-screen.play .letter-mask:nth-child(1) span { animation-delay: 0.45s; }
    #loading-screen.play .letter-mask:nth-child(2) span { animation-delay: 0.49s; }
    #loading-screen.play .letter-mask:nth-child(3) span { animation-delay: 0.53s; }
    #loading-screen.play .letter-mask:nth-child(4) span { animation-delay: 0.57s; }
    #loading-screen.play .letter-mask:nth-child(5) span { animation-delay: 0.61s; }
    #loading-screen.play .letter-mask:nth-child(6) span { animation-delay: 0.65s; }
    #loading-screen.play .letter-mask:nth-child(7) span { animation-delay: 0.69s; }
    @keyframes letterUp {
      from { opacity: 0; transform: translate3d(0, 105%, 0); }
      to   { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    /* Glossy floor reflection (12% opacity, static linear fade mask) */
    .word-reflection {
      margin-top: 0.18em;
      color: #DCE7FF;
      opacity: 0;
      transform: scaleY(-1);
      -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 76%);
      mask-image: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 76%);
      pointer-events: none;
      contain: layout paint;
      will-change: opacity;
      backface-visibility: hidden;
    }
    #loading-screen.play .word-reflection {
      animation: reflectionIn 0.50s var(--ease) 0.45s both;
    }
    @keyframes reflectionIn {
      from { opacity: 0; }
      to   { opacity: 0.12; }
    }

    .wordmark-sweep {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 26%, rgba(255, 248, 236, 0.58) 50%, transparent 74%);
      transform: translate3d(-115%, 0, 0);
      pointer-events: none;
      will-change: transform;
      backface-visibility: hidden;
    }
    #loading-screen.play .wordmark-sweep {
      animation: textSweep 0.25s var(--ease) 0.85s both;
    }
    @keyframes textSweep {
      from { transform: translate3d(-115%, 0, 0); }
      to   { transform: translate3d(115%, 0, 0); }
    }

    /* Weak device variant: one ring, no streak, no grain, no parallax, no bokeh, no type rows, no reflection */
    .lite-splash .ring-b,
    .lite-splash .streak-diag,
    .lite-splash .grain,
    .lite-splash .bokeh,
    .lite-splash .outline-row,
    .lite-splash .word-reflection {
      display: none;
    }
    .lite-splash.play .bg-leaks,
    .lite-splash.play .rings-shell {
      animation-duration: 0.55s, 0s;
    }

    /* Reduced motion: static composed frame (wordmark + rings only) with plain fade out */
    @media (prefers-reduced-motion: reduce) {
      #loading-screen.play .bg-leaks,
      #loading-screen.play .bezel-svg,
      #loading-screen.play .rings-shell,
      #loading-screen.play .ring-a-wrap,
      #loading-screen.play .ring-b,
      #loading-screen.play .streak-diag,
      #loading-screen.play .letter-mask span,
      #loading-screen.play .wordmark-sweep {
        animation: none !important;
      }
      .bg-leaks { opacity: 1; }
      .rings-shell { opacity: 1; transform: scale(1); }
      .streak-diag, .wordmark-sweep, .bokeh, .outline-row, .word-reflection { display: none; }
      .letter-mask span { opacity: 1; transform: none; }
    }
  </style>

  <script>
    if (!window.__settlivSplashInit) {
      window.__settlivSplashInit = true;

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }

      var __sequenceMs = 1100;
      var __playStart = null;
      var __firstFrameReady = false;
      var __splashRemoved = false;

      function __dismissSplash() {
        if (__splashRemoved) return;
        __splashRemoved = true;
        var loading = document.getElementById('loading-screen');
        if (!loading) return;
        loading.classList.add('reveal-out');
        setTimeout(function () {
          if (loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 310);
      }

      function __maybeDismiss() {
        if (!__firstFrameReady || __playStart === null) return;
        var elapsed = performance.now() - __playStart;
        var waitMs = Math.max(0, __sequenceMs - elapsed);
        setTimeout(__dismissSplash, waitMs);
      }

      function __startAnimation() {
        var el = document.getElementById('loading-screen');
        if (!el) return;
        var cores = navigator.hardwareConcurrency || 8;
        var mem = navigator.deviceMemory || 8;
        if (cores <= 4 || mem <= 4) {
          el.classList.add('lite-splash');
        }
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            el.classList.add('play');
            __playStart = performance.now();
            __maybeDismiss();
          });
        });
      }

      window.addEventListener('DOMContentLoaded', function () {
        var fontReady = (document.fonts && document.fonts.load)
          ? Promise.race([
              document.fonts.load('800 1em "BricolageGrotesque"'),
              new Promise(function (resolve) { setTimeout(resolve, 500); })
            ])
          : Promise.resolve();
        fontReady.then(__startAnimation, __startAnimation);
      });

      window.addEventListener('flutter-first-frame', function () {
        __firstFrameReady = true;
        __maybeDismiss();
      });

      setTimeout(__dismissSplash, 8000);
    }
  </script>
</head>
<body>
  <div id="loading-screen">
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="bokeh w1"></div>
    <div class="bokeh w2"></div>
    <div class="bokeh w3"></div>
    <div class="bokeh c1"></div>
