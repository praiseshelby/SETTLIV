<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Settliv — Expense Sharing & Group Ledger</title>
  <meta name="description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Settliv — Expense Sharing & Group Ledger">
  <meta property="og:description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <meta name="theme-color" content="#04060D">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Settliv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    @font-face {
      font-family: 'BricolageGrotesque';
      src: url('assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }

    :root {
      --base: #04060D;
      --ease: cubic-bezier(.2, .8, .2, 1);
      --ring-a: max(135vmin, 980px);
      --ring-b: max(105vmin, 780px);
    }
    @media (max-width: 600px) {
      :root {
        --ring-a: 94vw;
        --ring-b: 78vw;
      }
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: var(--base);
      font-family: 'BricolageGrotesque', 'Sora', 'PlusJakartaSans', sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--base);
      z-index: 99999;
      overflow: hidden;
      contain: layout paint;
      will-change: opacity;
      backface-visibility: hidden;
    }
    #loading-screen.reveal-out {
      pointer-events: none;
      animation: splashExit 300ms ease-out forwards;
    }
    @keyframes splashExit {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    /* Strong static vignette + optional faint grain */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(4, 6, 13, 0) 30%, rgba(0, 0, 0, 0.58) 100%);
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAH0lEQVQYV2NkYGD4z8DAwMgABXAGNgGwSgwVAFbmAgAw1wYFBcX5AAAAAElFTkSuQmCC");
      background-repeat: repeat;
    }

    /* Asymmetric off-centre warm (top-left) & cool (bottom-right) light leaks */
    .bg-leaks {
      position: absolute;
      inset: -8%;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      backface-visibility: hidden;
      opacity: 0.45;
      background:
        radial-gradient(circle at 14% 16%, rgba(255, 170, 110, 0.28) 0%, rgba(255, 170, 110, 0) 54%),
        radial-gradient(circle at 86% 84%, rgba(120, 200, 255, 0.18) 0%, rgba(120, 200, 255, 0) 54%);
    }
    #loading-screen.play .bg-leaks {
      animation: leaksBloom 0.55s var(--ease) 0s both, leaksParallax 9s ease-in-out 1.10s infinite alternate;
    }
    @keyframes leaksBloom {
      from { opacity: 0.45; transform: translate3d(0, 0, 0); }
      to   { opacity: 1.00; transform: translate3d(0, 0, 0); }
    }
    @keyframes leaksParallax {
      from { transform: translate3d(-1%, -0.8%, 0); }
      to   { transform: translate3d(1%, 0.8%, 0); }
    }

    /* Unclipped soft warm radial glow + elliptical legibility pad behind wordmark */
    .warm-word-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 52% 38% at 50% 50%, rgba(4, 6, 13, 0.58) 0%, rgba(4, 6, 13, 0) 100%),
        radial-gradient(circle at 50% 50%, rgba(255, 170, 110, 0.14) 0%, rgba(255, 170, 110, 0) 48%);
    }

    /* Faint secondary tick bezel (14% opacity) */
    .bezel-svg {
      position: absolute;
      width: var(--ring-a);
      height: var(--ring-a);
      pointer-events: none;
      contain: layout paint;
      will-change: transform;
      backface-visibility: hidden;
      opacity: 0.14;
    }
    #loading-screen.play .bezel-svg {
      animation: bezelSpin 64s linear 0s infinite;
    }
    @keyframes bezelSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Rings shell: 0-0.55s scale 0.8->1 + fade; handoff scale 1.4 + fade */
    .rings-shell {
      position: absolute;
      width: var(--ring-a);
      height: var(--ring-a);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      backface-visibility: hidden;
      opacity: 0;
      transform: scale(0.8);
    }
    #loading-screen.play .rings-shell {
      animation: ringsEnter 0.55s var(--ease) 0s both, ringsParallax 11s ease-in-out 1.10s infinite alternate;
    }
    #loading-screen.reveal-out .rings-shell {
      animation: ringsExit 300ms var(--ease) forwards;
    }
    @keyframes ringsEnter {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes ringsParallax {
      from { transform: translate3d(0.6%, 0.4%, 0) scale(1); }
      to   { transform: translate3d(-0.6%, -0.4%, 0) scale(1); }
    }
    @keyframes ringsExit {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(1.4); }
    }

    /* Rim-lit Ring A + soft wide glow duplicate in one rotating wrapper */
    .ring-a-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }
    #loading-screen.play .ring-a-wrap {
      animation:
        ringARamp 0.55s var(--ease) 0s both,
        ringAPulse 0.25s var(--ease) 0.85s,
        ringAIdle 24s linear 0.55s infinite;
    }
    @keyframes ringARamp {
      from { transform: rotate(-200deg); }
      to   { transform: rotate(0deg); }
    }
    @keyframes ringAPulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.68; }
    }
    @keyframes ringAIdle {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Rim-lit Ring B (105vmin on desktop, 78vw on phones), ice counter-rotating */
    .ring-b {
      position: absolute;
      width: var(--ring-b);
      height: var(--ring-b);
      border-radius: 50%;
      pointer-events: none;
      contain: layout paint;
      will-change: transform;
      backface-visibility: hidden;
      border: 2px solid rgba(143, 211, 255, 0.42);
    }
    #loading-screen.play .ring-b {
      animation:
        ringBRamp 0.55s var(--ease) 0s both,
        ringBIdle 28s linear 0.55s infinite;
    }
    @keyframes ringBRamp {
      from { transform: rotate(190deg); }
      to   { transform: rotate(0deg); }
    }
    @keyframes ringBIdle {
      from { transform: rotate(360deg); }
      to   { transform: rotate(0deg); }
    }

    .ring-a-core,
    .ring-a-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 178, 107, 0.50);
    }
    .ring-a-glow {
      opacity: 0.20;
      border-width: 8px;
    }

    /* Soft-edged conic heads (no hard wedge edges) */
    @supports ((mask: radial-gradient(#000, #000)) or (-webkit-mask: radial-gradient(#000, #000))) and (background: conic-gradient(red, blue)) {
      .ring-a-core {
        border: 0;
        background: conic-gradient(
          from 0deg,
          transparent 0deg 170deg,
          rgba(255, 178, 107, 0.35) 235deg,
          #FFB26B 285deg,
          #FFF1DC 325deg,
          rgba(255, 241, 220, 0.35) 346deg,
          transparent 360deg
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0);
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0);
      }
      .ring-a-glow {
        border: 0;
        background: conic-gradient(
          from 0deg,
          transparent 0deg 170deg,
          rgba(255, 178, 107, 0.35) 235deg,
          #FFB26B 285deg,
          #FFF1DC 325deg,
          rgba(255, 241, 220, 0.35) 346deg,
          transparent 360deg
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 16px), #000 0);
        mask: radial-gradient(farthest-side, transparent calc(100% - 16px), #000 0);
      }
      .ring-b {
        border: 0;
        background: conic-gradient(
          from 0deg,
          transparent 0deg 170deg,
          rgba(143, 211, 255, 0.35) 235deg,
          #8FD3FF 285deg,
          #FFFFFF 325deg,
          rgba(255, 255, 255, 0.35) 346deg,
          transparent 360deg
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
      }
    }

    /* Thin diagonal light streak (-8deg) crossing BEFORE wordmark rises (0.30-0.50s) */
    .streak-diag {
      position: absolute;
      top: 50%;
      left: -10vw;
      width: 120vw;
      height: 2px;
      margin-top: -1px;
      background: linear-gradient(90deg, transparent 0%, #FFD9A8 30%, #FFFFFF 50%, #8FD3FF 70%, transparent 100%);
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      backface-visibility: hidden;
      opacity: 0;
      transform: rotate(-8deg) scaleX(0);
    }
    #loading-screen.play .streak-diag {
      animation: streakCross 0.20s var(--ease) 0.30s both;
    }
    @keyframes streakCross {
      0%   { opacity: 0; transform: rotate(-8deg) scaleX(0); }
      45%  { opacity: 1; transform: rotate(-8deg) scaleX(1); }
      100% { opacity: 0; transform: rotate(-8deg) scaleX(1); }
    }

    /* Wordmark: masked rise, NO text-shadow inside masks, NO 3D, NO ghosts */
    .brand-center {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: min(44vw, 560px);
      will-change: transform, opacity;
      backface-visibility: hidden;
    }
    @media (max-width: 600px) {
      .brand-center {
        max-width: 80vw;
      }
    }
    #loading-screen.reveal-out .brand-center {
      animation: wordExit 300ms var(--ease) forwards;
    }
    @keyframes wordExit {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(1.03); }
    }

    .wordmark-stage {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .loading-wordmark {
      display: inline-flex;
      font-family: 'BricolageGrotesque', 'Sora', 'PlusJakartaSans', sans-serif;
      font-size: clamp(24px, min(6.2vw, 96px), 96px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      padding-left: 0.2em;
      line-height: 1.04;
      white-space: nowrap;
    }
    @media (max-width: 600px) {
      .loading-wordmark {
        font-size: clamp(22px, 7.2vw, 38px);
      }
    }

    .letter-mask {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
    }
    .letter-mask span {
      display: inline-block;
      background: linear-gradient(180deg, #FFFFFF 0%, #DCE7FF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      transform: translate3d(0, 105%, 0);
      will-change: transform, opacity;
      backface-visibility: hidden;
    }
    #loading-screen.play .letter-mask span {
      animation: letterUp 0.26s var(--ease) both;
    }
    #loading-screen.play .letter-mask:nth-child(1) span { animation-delay: 0.45s; }
    #loading-screen.play .letter-mask:nth-child(2) span { animation-delay: 0.49s; }
    #loading-screen.play .letter-mask:nth-child(3) span { animation-delay: 0.53s; }
    #loading-screen.play .letter-mask:nth-child(4) span { animation-delay: 0.57s; }
    #loading-screen.play .letter-mask:nth-child(5) span { animation-delay: 0.61s; }
    #loading-screen.play .letter-mask:nth-child(6) span { animation-delay: 0.65s; }
    #loading-screen.play .letter-mask:nth-child(7) span { animation-delay: 0.69s; }
    @keyframes letterUp {
      from { opacity: 0; transform: translate3d(0, 105%, 0); }
      to   { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    .wordmark-sweep {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 28%, rgba(255, 241, 220, 0.44) 50%, transparent 72%);
      transform: translate3d(-115%, 0, 0);
      pointer-events: none;
      will-change: transform;
      backface-visibility: hidden;
    }
    #loading-screen.play .wordmark-sweep {
      animation: textSweep 0.25s var(--ease) 0.85s both;
    }
    @keyframes textSweep {
      from { transform: translate3d(-115%, 0, 0); }
      to   { transform: translate3d(115%, 0, 0); }
    }

    /* Weak device variant: one ring, no streak, no grain, no parallax */
    .lite-splash .ring-b,
    .lite-splash .streak-diag,
    .lite-splash .grain {
      display: none;
    }
    .lite-splash.play .bg-leaks,
    .lite-splash.play .rings-shell {
      animation-duration: 0.55s, 0s;
    }

    /* Reduced motion: static composed frame with plain fade out */
    @media (prefers-reduced-motion: reduce) {
      #loading-screen.play .bg-leaks,
      #loading-screen.play .bezel-svg,
      #loading-screen.play .rings-shell,
      #loading-screen.play .ring-a-wrap,
      #loading-screen.play .ring-b,
      #loading-screen.play .streak-diag,
      #loading-screen.play .letter-mask span,
      #loading-screen.play .wordmark-sweep {
        animation: none !important;
      }
      .bg-leaks { opacity: 1; }
      .rings-shell { opacity: 1; transform: scale(1); }
      .streak-diag, .wordmark-sweep { display: none; }
      .letter-mask span { opacity: 1; transform: none; }
    }
  </style>

  <script>
    if (!window.__settlivSplashInit) {
      window.__settlivSplashInit = true;

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }

      var __sequenceMs = 1100;
      var __playStart = null;
      var __firstFrameReady = false;
      var __splashRemoved = false;

      function __dismissSplash() {
        if (__splashRemoved) return;
        __splashRemoved = true;
        var loading = document.getElementById('loading-screen');
        if (!loading) return;
        loading.classList.add('reveal-out');
        setTimeout(function () {
          if (loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 310);
      }

      function __maybeDismiss() {
        if (!__firstFrameReady || __playStart === null) return;
        var elapsed = performance.now() - __playStart;
        var waitMs = Math.max(0, __sequenceMs - elapsed);
        setTimeout(__dismissSplash, waitMs);
      }

      function __startAnimation() {
        var el = document.getElementById('loading-screen');
        if (!el) return;
        var cores = navigator.hardwareConcurrency || 8;
        var mem = navigator.deviceMemory || 8;
        if (cores <= 4 || mem <= 4) {
          el.classList.add('lite-splash');
        }
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            el.classList.add('play');
            __playStart = performance.now();
            __maybeDismiss();
          });
        });
      }

      window.addEventListener('DOMContentLoaded', function () {
        var fontReady = (document.fonts && document.fonts.load)
          ? Promise.race([
              document.fonts.load('800 1em "BricolageGrotesque"'),
              new Promise(function (resolve) { setTimeout(resolve, 500); })
            ])
          : Promise.resolve();
        fontReady.then(__startAnimation, __startAnimation);
      });

      window.addEventListener('flutter-first-frame', function () {
        __firstFrameReady = true;
        __maybeDismiss();
      });

      setTimeout(__dismissSplash, 8000);
    }
  </script>
</head>
<body>
  <div id="loading-screen">
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="bg-leaks"></div>
    <div class="warm-word-glow"></div>
    <svg class="bezel-svg" viewBox="0 0 400 400" fill="none" aria-hidden="true">
      <g stroke="rgba(255,255,255,0.9)" stroke-width="0.9">
        <line x1="200" y1="6" x2="200" y2="16"/>
        <line x1="200" y1="6" x2="200" y2="12" transform="rotate(15 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="16" transform="rotate(30 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="12" transform="rotate(45 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="16" transform="rotate(60 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="12" transform="rotate(75 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="16" transform="rotate(90 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="12" transform="rotate(105 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="16" transform="rotate(120 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="12" transform="rotate(135 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="16" transform="rotate(150 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="12" transform="rotate(165 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="16" transform="rotate(180 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="12" transform="rotate(195 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="16" transform="rotate(210 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="12" transform="rotate(225 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="16" transform="rotate(240 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="12" transform="rotate(255 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="16" transform="rotate(270 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="12" transform="rotate(285 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="16" transform="rotate(300 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="12" transform="rotate(315 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="16" transform="rotate(330 200 200)"/>
        <line x1="200" y1="6" x2="200" y2="12" transform="rotate(345 200 200)"/>
      </g>
    </svg>
    <div class="rings-shell">
      <div class="ring-a-wrap">
        <div class="ring-a-glow"></div>
        <div class="ring-a-core"></div>
      </div>
      <div class="ring-b"></div>
    </div>
    <div class="streak-diag"></div>
    <div class="brand-center">
      <div class="wordmark-stage">
        <div class="loading-wordmark">
          <span class="letter-mask"><span>S</span></span>
          <span class="letter-mask"><span>E</span></span>
          <span class="letter-mask"><span>T</span></span>
          <span class="letter-mask"><span>T</span></span>
          <span class="letter-mask"><span>L</span></span>
          <span class="letter-mask"><span>I</span></span>
          <span class="letter-mask"><span>V</span></span>
        </div>
        <div class="wordmark-sweep"></div>
      </div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
