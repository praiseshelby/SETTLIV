<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Settliv — Expense Sharing & Group Ledger</title>
  <meta name="description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Settliv — Expense Sharing & Group Ledger">
  <meta property="og:description" content="Settliv is a modern, exact-paise group expense sharing and ledger web application.">

  <meta name="theme-color" content="#070A14">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Settliv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    @font-face {
      font-family: 'BricolageGrotesque';
      src: url('assets/assets/fonts/BricolageGrotesque-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }

    :root {
      --bg-deep: #070A14;
      --bg-mid: #0B1020;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-deep);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(155deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
      z-index: 99999;
      overflow: hidden;
      contain: layout paint;
      will-change: opacity;
      transition: opacity 300ms ease-out;
    }
    #loading-screen.reveal-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Static radial colour fields (pearl/ice + lavender), transform drift only */
    .bg-field {
      position: absolute;
      inset: -18%;
      pointer-events: none;
      contain: layout paint;
      will-change: transform;
    }
    .bg-field.ice {
      background:
        radial-gradient(circle at 30% 30%, rgba(159, 216, 255, 0.075) 0%, rgba(159, 216, 255, 0) 52%),
        radial-gradient(circle at 50% 50%, rgba(245, 247, 255, 0.035) 0%, rgba(245, 247, 255, 0) 48%);
      animation: driftA 14s ease-in-out infinite alternate;
    }
    .bg-field.lavender {
      background: radial-gradient(circle at 72% 68%, rgba(185, 180, 255, 0.08) 0%, rgba(185, 180, 255, 0) 54%);
      animation: driftB 16s ease-in-out infinite alternate;
    }
    @keyframes driftA {
      from { transform: translate3d(-1.5%, -1%, 0); }
      to   { transform: translate3d(1.5%, 1.5%, 0); }
    }
    @keyframes driftB {
      from { transform: translate3d(1.5%, 1%, 0); }
      to   { transform: translate3d(-1.5%, -1.5%, 0); }
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 38%, rgba(4, 6, 14, 0.74) 100%);
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAH0lEQVQYV2NkYGD4z8DAwMgABXAGNgGwSgwVAFbmAgAw1wYFBcX5AAAAAElFTkSuQmCC");
      background-repeat: repeat;
    }

    /* Precision SVG Dial (110vmin, 3 concentric rings + bezel ticks) */
    .dial-stage {
      position: absolute;
      width: 110vmin;
      height: 110vmin;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      animation: dialEnter 0.5s var(--ease) forwards;
      transition: transform 300ms var(--ease), opacity 300ms ease-out;
    }
    @keyframes dialEnter {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    #loading-screen.reveal-out .dial-stage {
      opacity: 0;
      transform: scale(1.2) rotate(8deg);
    }

    .dial-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .dial-outer {
      transform-origin: 200px 200px;
      will-change: transform;
      animation: spinCW 28s linear infinite;
    }
    .dial-inner {
      transform-origin: 200px 200px;
      will-change: transform;
      animation: spinCCW 22s linear infinite;
    }
    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes spinCCW {
      from { transform: rotate(360deg); }
      to   { transform: rotate(0deg); }
    }

    /* Two luminous pearl points with short comet tails spiraling to centre (0-0.55s) */
    .comet-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 78vmin;
      height: 78vmin;
      margin: -39vmin 0 0 -39vmin;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
    }
    .comet-wrap.a { animation: cometA 0.54s var(--ease) forwards; }
    .comet-wrap.b { animation: cometB 0.54s var(--ease) forwards; }
    @keyframes cometA {
      0%   { opacity: 0; transform: rotate(-40deg) scale(1); }
      35%  { opacity: 1; transform: rotate(85deg) scale(0.62); }
      92%  { opacity: 1; transform: rotate(200deg) scale(0.03); }
      100% { opacity: 0; transform: rotate(215deg) scale(0.01); }
    }
    @keyframes cometB {
      0%   { opacity: 0; transform: rotate(140deg) scale(1); }
      35%  { opacity: 1; transform: rotate(265deg) scale(0.62); }
      92%  { opacity: 1; transform: rotate(380deg) scale(0.03); }
      100% { opacity: 0; transform: rotate(395deg) scale(0.01); }
    }
    .comet-head {
      position: absolute;
      top: 0;
      left: 50%;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: #FFFFFF;
    }
    .comet-tail {
      position: absolute;
      top: -1px;
      left: calc(50% - 38px);
      width: 38px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(235, 244, 255, 0.78) 100%);
      transform-origin: right center;
      transform: rotate(-8deg);
    }

    /* Soft centre glow pulse at convergence + idle 2% breathe */
    .zero-glow {
      position: absolute;
      width: min(64vmin, 460px);
      height: min(64vmin, 460px);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(235, 245, 255, 0.20) 0%, rgba(159, 216, 255, 0.06) 40%, transparent 72%);
      opacity: 0;
      pointer-events: none;
      contain: layout paint;
      will-change: transform, opacity;
      animation: glowIgnite 0.55s var(--ease) 0.48s forwards, glowBreathe 3.8s ease-in-out 1.2s infinite alternate;
    }
    @keyframes glowIgnite {
      0%   { opacity: 0; transform: scale(0.75); }
      45%  { opacity: 0.95; transform: scale(1.04); }
      100% { opacity: 0.42; transform: scale(1); }
    }
    @keyframes glowBreathe {
      from { transform: scale(1); opacity: 0.42; }
      to   { transform: scale(1.02); opacity: 0.52; }
    }

    /* Brand centre: wordmark rises out of zero line, zero line contracts to underline */
    .brand-center {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wordmark-stage {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .wordmark-typo {
      font-family: 'BricolageGrotesque', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(40px, 6vw, 64px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      padding-left: 0.22em;
      line-height: 1;
      white-space: nowrap;
    }
    .ghost-wordmark {
      position: absolute;
      inset: 0;
      color: rgba(240, 246, 255, 0.9);
      pointer-events: none;
      opacity: 0;
      contain: layout paint;
      will-change: transform, opacity;
    }
    .ghost-wordmark.g1 { animation: ghostRise1 0.46s var(--ease) 0.70s forwards; }
    .ghost-wordmark.g2 { animation: ghostRise2 0.46s var(--ease) 0.70s forwards; }
    @keyframes ghostRise1 {
      0%   { opacity: 0.22; transform: translate3d(0, 26px, 0) scaleY(1.1); }
      100% { opacity: 0; transform: translate3d(0, 0, 0) scaleY(1); }
    }
    @keyframes ghostRise2 {
      0%   { opacity: 0.10; transform: translate3d(0, 32px, 0) scaleY(1.14); }
      100% { opacity: 0; transform: translate3d(0, 0, 0) scaleY(1); }
    }

    .loading-wordmark {
      display: inline-flex;
    }
    .letter-mask {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
    }
    .letter-mask span {
      display: inline-block;
      background: linear-gradient(180deg, #FFFFFF 0%, #DCE6FF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transform: translateY(110%);
      will-change: transform;
      animation: letterUp 0.34s var(--ease) forwards;
    }
    .letter-mask:nth-child(1) span { animation-delay: 0.70s; }
    .letter-mask:nth-child(2) span { animation-delay: 0.735s; }
    .letter-mask:nth-child(3) span { animation-delay: 0.77s; }
    .letter-mask:nth-child(4) span { animation-delay: 0.805s; }
    .letter-mask:nth-child(5) span { animation-delay: 0.84s; }
    .letter-mask:nth-child(6) span { animation-delay: 0.875s; }
    .letter-mask:nth-child(7) span { animation-delay: 0.91s; }
    @keyframes letterUp {
      to { transform: translateY(0); }
    }

    .wordmark-sweep {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 26%, rgba(255, 255, 255, 0.45) 50%, transparent 74%);
      transform: translateX(-115%);
      pointer-events: none;
      will-change: transform;
      animation: textSweep 0.42s var(--ease) 1.05s forwards;
    }
    @keyframes textSweep {
      to { transform: translateX(115%); }
    }

    /* Zero line: ignites from centre to 70vw, then contracts to wordmark underline */
    .zero-line-wrap {
      position: relative;
      width: 70vw;
      height: 1.5px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .zero-line {
      width: 100%;
      height: 1.5px;
      background-color: rgba(240, 246, 255, 0.36);
      transform: scaleX(0);
      will-change: transform;
      animation: zeroLineSequence 0.65s var(--ease) 0.50s forwards;
    }
    @keyframes zeroLineSequence {
      0%   { transform: scaleX(0); }
      38%  { transform: scaleX(1); }
      100% { transform: scaleX(0.28); }
    }
    .zero-core {
      position: absolute;
      width: 90px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent 0%, #FFFFFF 50%, transparent 100%);
      opacity: 0;
      transform: translateX(-35vw);
      will-change: transform, opacity;
      animation: coreTravel 0.42s var(--ease) 0.50s forwards;
    }
    @keyframes coreTravel {
      0%   { opacity: 0; transform: translateX(-35vw); }
      30%  { opacity: 1; }
      100% { opacity: 0; transform: translateX(35vw); }
    }

    /* Weak device variant: one ring group, no ghosts, no grain */
    .lite-splash .dial-inner,
    .lite-splash .ghost-wordmark,
    .lite-splash .grain {
      display: none;
    }

    /* Reduced motion: static composed frame (dial, line, wordmark) + plain fade out */
    @media (prefers-reduced-motion: reduce) {
      .bg-field, .dial-stage, .dial-outer, .dial-inner, .comet-wrap, .zero-glow, .ghost-wordmark, .letter-mask span, .wordmark-sweep, .zero-line, .zero-core {
        animation: none !important;
      }
      .dial-stage { opacity: 1; transform: scale(1); }
      .comet-wrap, .ghost-wordmark, .wordmark-sweep, .zero-core { display: none; }
      .zero-glow { opacity: 0.4; transform: scale(1); }
      .letter-mask span { transform: translateY(0); }
      .zero-line { transform: scaleX(0.28); }
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    const __splashStart = performance.now();
    const __wordmarkBeatMs = 1200;

    window.addEventListener('DOMContentLoaded', function () {
      const el = document.getElementById('loading-screen');
      if (!el) return;
      const cores = navigator.hardwareConcurrency || 8;
      const mem = navigator.deviceMemory || 8;
      if (cores <= 4 || mem <= 4) {
        el.classList.add('lite-splash');
      }
    });

    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading-screen');
      if (!loading) return;
      const elapsed = performance.now() - __splashStart;
      const waitMs = Math.max(0, __wordmarkBeatMs - elapsed);
      setTimeout(function () {
        loading.classList.add('reveal-out');
        setTimeout(function () {
          if (loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 310);
      }, waitMs);
    });
  </script>
</head>
<body>
  <div id="loading-screen">
    <div class="bg-field ice"></div>
    <div class="bg-field lavender"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="dial-stage">
      <svg class="dial-svg" viewBox="0 0 400 400" fill="none" aria-hidden="true">
        <g class="dial-outer" stroke="rgba(235,244,255,0.12)" stroke-width="0.9">
          <circle cx="200" cy="200" r="186"/>
          <circle cx="200" cy="200" r="144" stroke-opacity="0.75"/>
          <g stroke-opacity="0.85">
            <line x1="200" y1="8" x2="200" y2="18"/>
            <line x1="200" y1="8" x2="200" y2="15" transform="rotate(15 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="18" transform="rotate(30 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="15" transform="rotate(45 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="18" transform="rotate(60 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="15" transform="rotate(75 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="18" transform="rotate(90 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="15" transform="rotate(105 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="18" transform="rotate(120 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="15" transform="rotate(135 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="18" transform="rotate(150 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="15" transform="rotate(165 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="18" transform="rotate(180 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="15" transform="rotate(195 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="18" transform="rotate(210 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="15" transform="rotate(225 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="18" transform="rotate(240 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="15" transform="rotate(255 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="18" transform="rotate(270 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="15" transform="rotate(285 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="18" transform="rotate(300 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="15" transform="rotate(315 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="18" transform="rotate(330 200 200)"/>
            <line x1="200" y1="8" x2="200" y2="15" transform="rotate(345 200 200)"/>
          </g>
        </g>
        <g class="dial-inner" stroke="rgba(185,180,255,0.11)" stroke-width="0.9">
          <circle cx="200" cy="200" r="102" stroke-dasharray="6 8"/>
        </g>
      </svg>
    </div>
    <div class="comet-wrap a"><div class="comet-tail"></div><div class="comet-head"></div></div>
    <div class="comet-wrap b"><div class="comet-tail"></div><div class="comet-head"></div></div>
    <div class="zero-glow"></div>
    <div class="brand-center">
      <div class="wordmark-stage">
        <div class="wordmark-typo ghost-wordmark g1" aria-hidden="true">SETTLIV</div>
        <div class="wordmark-typo ghost-wordmark g2" aria-hidden="true">SETTLIV</div>
        <div class="wordmark-typo loading-wordmark"><span class="letter-mask"><span>S</span></span><span class="letter-mask"><span>E</span></span><span class="letter-mask"><span>T</span></span><span class="letter-mask"><span>T</span></span><span class="letter-mask"><span>L</span></span><span class="letter-mask"><span>I</span></span><span class="letter-mask"><span>V</span></span></div>
        <div class="wordmark-sweep"></div>
      </div>
      <div class="zero-line-wrap">
        <div class="zero-line"></div>
        <div class="zero-core"></div>
      </div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
